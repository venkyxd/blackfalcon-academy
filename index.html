<style>

const D=[{"id": "a", "name": "CompTIA A+ 220-1201", "sub": "Core 1 · Section 1: Mobile Devices", "icon": "🧩", "topics": [{"id": "1.1", "name": "1.1 Laptop Hardware", "tag": "Messer 220-1201 notes", "blocks": [{"h": "TOPIC", "b": ["Laptop hardware: the battery, keyboard, memory, storage, wireless, biometric, NFC (Near-Field Communication), camera and microphone parts of a laptop, and how each one is replaced or upgraded"]}, {"h": "OBJECTIVE", "b": ["Install and configure laptop hardware and components", "Know what can be swapped, how each part connects, and what to test first when it fails"]}, {"h": "KEY POINTS", "r": [["LAPTOP DESIGN", ["Parts are tiny and built to precise specs, so troubleshooting must be precise too", "Some laptops open easily (user can replace memory or storage); others are sealed and hard to service", "Every manufacturer has its own replacement process: follow the maker’s instructions"]], ["BATTERY", ["Two types: <b>Li-ion<\/b> (Lithium-ion) and <b>Li-poly<\/b> (Lithium-ion polymer)", "No <b>memory effect<\/b>: recharge any time without losing capacity", "Form factor differs by make and model: buy the exact battery for that model", "<b>Modular<\/b> battery: press the release button, slide it out, slide the new one in", "<b>Built-in<\/b> battery: a technician must take the laptop apart to replace it"]], ["KEYBOARD", ["The most replaced laptop component", "Usually comes out as one unit: remove the bezel or a few screws", "Connects to the system board with a <b>ribbon cable<\/b> (disconnect and reconnect at the connector)", "<b>Fn<\/b> (Function) key and Windows key combine with other keys for secondary functions", "Wider laptops may have a built-in numeric keypad", "A single <b>keycap<\/b> can be replaced, but laptop keys are fragile: follow the manufacturer’s steps"]], ["MEMORY (RAM)", ["<b>RAM<\/b> (Random-Access Memory) in laptops uses <b>SO-DIMM<\/b> (Small Outline Dual In-line Memory Module), smaller than a desktop <b>DIMM<\/b> (Dual In-line Memory Module)", "Open the access panel on the back, remove or add modules; pushing the module down locks it with clips", "Some laptops have <b>soldered<\/b> memory: not upgradeable, the whole system board would have to be replaced"]], ["STORAGE", ["<b>HDD<\/b> (Hard Disk Drive): spinning platters; laptop size is <b>2.5-inch<\/b> (desktop uses 3.5-inch)", "<b>SSD<\/b> (Solid-State Drive): just memory, no moving parts: faster and more reliable", "Older 2.5-inch form factor uses two connections: one for data, one for power", "Newer laptops use <b>M.2<\/b>: much smaller, plugs directly into the system board, held by a single screw", "Replace a drive: remove the back cover, remove the screws, pull the drive out; reverse to install"]], ["HDD TO SSD UPGRADE", ["Big speed and reliability boost for an older laptop", "Method 1: clean OS (Operating System) install, copy documents by hand, reinstall apps (slow)", "Method 2: <b>imaging / cloning software<\/b> makes an exact copy of the old drive on the new SSD (faster)", "SSD makers often include cloning software; third-party tools also work", "Clone through an image saved on a separate device, or connect old and new drives together and clone directly"]], ["WIRELESS CARDS", ["Many laptops have no wired port: they rely on <b>802.11<\/b> (IEEE wireless standard, Wi-Fi) and <b>Bluetooth<\/b>", "Newer laptops: wireless is on the motherboard; older ones use a modular card: <b>Mini PCI<\/b> (Peripheral Component Interconnect) or <b>Mini PCIe<\/b> (PCI Express)", "Card sits under a back panel and locks in; small antenna connectors sit on the card", "802.11 card has two antenna connectors: <b>main<\/b> and <b>auxiliary<\/b> (gray and black wires); a third antenna handles Bluetooth", "Antenna wires run around the display (to sit as high as possible) and down to the system board: reconnect them after a screen replacement", "802.11 is used on a <b>LAN<\/b> (Local Area Network) inside a building; Bluetooth is short-range and is called a <b>PAN<\/b> (Personal Area Network)"]], ["BIOMETRICS", ["Unlock the laptop with a <b>fingerprint<\/b> or <b>face recognition<\/b> instead of a password", "Needs both: an OS that supports it and the hardware (fingerprint reader, or camera for face recognition)", "Windows has two: <b>Windows Hello Face<\/b> and <b>Windows Hello Fingerprint<\/b>"]], ["NFC", ["<b>NFC<\/b> (Near-Field Communication): very short range, about 4 centimeters or less", "Use: tap-to-pay with a phone or smartwatch at a point of sale terminal", "Use: authenticate with an access card or NFC device at hospital workstations, warehouses, manufacturing, shipping and receiving"]], ["CAMERA AND MIC", ["Camera sits top center of the screen: video capture and live video calls", "Microphones are usually on the left and right of the camera", "Need better quality: attach an external, higher-definition webcam on top of the display"]]]}, {"h": "IMPORTANT CONCEPTS", "r": [["MODULAR VS BUILT-IN", ["Modular: user can remove and replace it (battery button, memory slot, M.2 slot)", "Built-in or soldered: needs a technician, or a full system board replacement"]], ["2.5-INCH VS M.2", ["2.5-inch: larger, separate data and power connections, a couple of screws", "M.2: small, plugs straight into the board, one screw"]], ["CLEAN INSTALL VS CLONE", ["Clean install: fresh OS, manual file copy, reinstall apps", "Clone / image: exact duplicate of the old drive onto the new one"]], ["LAN VS PAN", ["LAN (Local Area Network): 802.11 Wi-Fi inside a building", "PAN (Personal Area Network): Bluetooth for mouse, keyboard and other peripherals"]]]}, {"h": "FULL FORMS", "c": ["<b>LAN<\/b> (Local Area Network)", "<b>PAN<\/b> (Personal Area Network)", "<b>NFC<\/b> (Near-Field Communication)", "<b>SSD<\/b> (Solid-State Drive)", "<b>HDD<\/b> (Hard Disk Drive)", "<b>RAM<\/b> (Random-Access Memory)", "<b>DIMM<\/b> (Dual In-line Memory Module)", "<b>SO-DIMM<\/b> (Small Outline Dual In-line Memory Module)", "<b>Li-ion<\/b> (Lithium-ion)", "<b>Li-poly<\/b> (Lithium-ion polymer)", "<b>PCI<\/b> (Peripheral Component Interconnect)", "<b>PCIe<\/b> (Peripheral Component Interconnect Express)", "<b>OS<\/b> (Operating System)", "<b>Fn<\/b> (Function key)", "<b>IEEE<\/b> (Institute of Electrical and Electronics Engineers)", "<b>802.11<\/b> (IEEE wireless LAN standard (Wi-Fi))"]}, {"h": "EXAM FOCUS", "b": ["Laptop battery types: <b>Li-ion<\/b> and <b>Li-poly<\/b>: neither has a memory effect", "A replacement battery must match the exact laptop make and model", "Keyboard is the most replaced part; it connects with a ribbon cable", "Laptop memory is <b>SO-DIMM<\/b>; soldered memory means replacing the system board", "Laptop storage: 2.5-inch HDD or SSD, or an <b>M.2<\/b> SSD", "HDD to SSD upgrade is done fastest with <b>cloning / imaging software<\/b>", "802.11 card: main plus auxiliary antenna; Bluetooth has its own third antenna; cards are Mini PCI or Mini PCIe", "Bluetooth is a <b>PAN<\/b>; 802.11 is used on a <b>LAN<\/b>", "Biometrics need hardware plus OS support: Windows Hello Face and Windows Hello Fingerprint", "<b>NFC<\/b> range is about 4 cm or less: payments and badge authentication", "Camera is top center; microphones are left and right of it"]}, {"h": "QUICK REVISION", "b": ["<b>Battery:<\/b> Li-ion / Li-poly, no memory effect, model-specific, modular or built-in", "<b>Keyboard:<\/b> one unit, ribbon cable, test with external USB keyboard, keycaps are fragile", "<b>RAM:<\/b> SO-DIMM, back panel, clips lock it, can be soldered", "<b>Storage:<\/b> 2.5-inch HDD / SSD or M.2 (one screw); migrate with cloning software", "<b>Wireless:<\/b> 802.11 (LAN) + Bluetooth (PAN), Mini PCI / Mini PCIe, main + aux antenna + Bluetooth antenna", "<b>Biometrics:<\/b> fingerprint or face, hardware + OS, Windows Hello", "<b>NFC:<\/b> about 4 cm or less, payments and badge login", "<b>Camera and mic:<\/b> camera top center, mics left and right, external webcam for better quality"]}], "probs": [["KEYBOARD FAULT", ["Plug in an external USB (Universal Serial Bus) keyboard to test", "External works but internal does not: internal keyboard hardware or ribbon cable problem", "Both misbehave: look at the operating system"]], ["BATTERY", ["New battery does not fit: wrong make or model", "Cannot remove the battery: it is built in, a technician must open the laptop"]], ["MEMORY", ["Cannot add or upgrade RAM: memory may be soldered, so the system board must be replaced"]], ["SLOW LAPTOP", ["Older laptop with a spinning HDD: upgrade to an SSD, using cloning software to keep everything"]], ["WEAK WIRELESS", ["Poor Wi-Fi or Bluetooth after a screen or card replacement: check the antenna wires (main, auxiliary, Bluetooth) are reconnected"]], ["BIOMETRIC LOGIN", ["Option missing or failing: check the reader or camera hardware and that the OS supports it"]], ["HANDLING", ["Follow the manufacturer’s steps for keycaps and internal parts: they are fragile", "Keep the tiny screws organized (screw pad or tray) while the laptop is open"]]], "qs": [{"q": "Which two battery technologies are commonly used in laptops?", "o": ["Lithium-ion and lithium-ion polymer", "Nickel-metal hydride and alkaline", "Alkaline and zinc-carbon", "Nickel-cadmium and lead-acid"], "a": 0, "e": "Laptops use Li-ion and Li-poly batteries."}, {"q": "Which statement about modern laptop batteries and the memory effect is correct?", "o": ["They must be fully discharged before every recharge", "Li-ion and Li-poly batteries have no memory effect, so they can be recharged at any time", "Li-poly batteries develop a memory effect but Li-ion do not", "The memory effect only affects built-in batteries"], "a": 1, "e": "No memory effect means partial charging does not reduce capacity."}, {"q": "What does SO-DIMM stand for?", "o": ["Small Optical Direct Interface Memory Module", "Serial Output Double In-line Memory Module", "Standard Output Dual Inline Memory Module", "Small Outline Dual In-line Memory Module"], "a": 3, "e": "SO-DIMM is the small memory module used in laptops."}, {"q": "Which memory form factor is used in most laptops?", "o": ["RIMM", "SIMM", "SO-DIMM", "Full-size DIMM"], "a": 2, "e": "Laptops use the smaller SO-DIMM instead of the desktop DIMM."}, {"q": "A technician opens a laptop memory panel and finds no slots because the RAM is soldered. What is required to upgrade the memory?", "o": ["Replace the CMOS battery", "Update the BIOS", "Replace the system board", "Install a SO-DIMM in the drive bay"], "a": 2, "e": "Soldered memory cannot be changed; the system board must be replaced."}, {"q": "Which drive size is typical for a laptop hard disk drive?", "o": ["5.25-inch", "3.5-inch", "8-inch", "2.5-inch"], "a": 3, "e": "Laptops use 2.5-inch drives; desktops use 3.5-inch."}, {"q": "Which storage form factor plugs directly into the system board and is held by a single screw?", "o": ["3.5-inch SATA drive", "M.2", "2.5-inch drive bay", "PCI expansion card"], "a": 1, "e": "M.2 drives are small and secured with one screw."}, {"q": "What is the main difference between an SSD and an HDD?", "o": ["An SSD has no moving parts", "An SSD uses spinning platters", "An SSD is always larger than an HDD", "An SSD cannot be used in a laptop"], "a": 0, "e": "An SSD is memory only, so it is faster and more reliable."}, {"q": "Older 2.5-inch laptop drives use which type of connections?", "o": ["Only a wireless connection", "A ribbon cable that also holds the screen", "One connection for data and one for power", "A single combined optical connector"], "a": 2, "e": "The 2.5-inch drive has separate data and power connections."}, {"q": "What is the fastest way to move the OS, apps and data from an old HDD to a new SSD?", "o": ["Use cloning or imaging software", "Reinstall every program by hand", "Defragment the HDD and swap the drives", "Copy only the documents folder"], "a": 0, "e": "Cloning makes an exact copy of the old drive on the new one."}, {"q": "Which laptop component is the most commonly replaced?", "o": ["Motherboard", "Keyboard", "Display panel", "Processor"], "a": 1, "e": "The keyboard is the most replaced laptop part."}, {"q": "How is a laptop keyboard usually connected to the system board?", "o": ["Molex connector", "SATA cable", "HDMI cable", "Ribbon cable"], "a": 3, "e": "A ribbon cable connects the keyboard to the board."}, {"q": "What is the purpose of the Fn key on a laptop?", "o": ["It locks the screen only", "It opens the BIOS setup directly", "It restarts the laptop", "It combines with other keys to give secondary functions"], "a": 3, "e": "Fn plus another key triggers a secondary function."}, {"q": "Which form factors do older, modular laptop wireless cards use?", "o": ["AGP or ISA", "PCIe x16 or VGA", "Mini PCI or Mini PCIe", "SO-DIMM or M.2"], "a": 2, "e": "Older laptops use Mini PCI or Mini PCIe wireless cards."}, {"q": "What are the two antenna connectors on an 802.11 laptop wireless card called?", "o": ["Left and right", "Main and auxiliary", "Send and receive", "Primary and tertiary"], "a": 1, "e": "Main and auxiliary, usually gray and black wires."}, {"q": "Where do laptop antenna wires usually run?", "o": ["Around the display", "Along the battery bay", "Through the hinge to the power jack", "Under the keyboard only"], "a": 0, "e": "They wrap around the display to sit high for better reception."}, {"q": "Which network type does Bluetooth form?", "o": ["LAN", "MAN", "WAN", "PAN"], "a": 3, "e": "Bluetooth is a Personal Area Network."}, {"q": "Which two Windows features use biometrics?", "o": ["Windows Hello Face and Windows Hello Fingerprint", "Windows Hello PIN and Windows Hello password", "BitLocker and Secure Boot", "Windows Defender and SmartScreen"], "a": 0, "e": "Face and Fingerprint are the biometric Hello options."}, {"q": "What does biometric login need to work on a laptop?", "o": ["A smart card only", "Only a strong password", "OS support plus hardware such as a fingerprint reader or camera", "An NFC chip only"], "a": 2, "e": "Both OS support and the matching hardware are required."}, {"q": "What is the typical range of NFC?", "o": ["About 100 meters", "About 4 centimeters or less", "About 30 meters", "About 10 meters"], "a": 1, "e": "NFC is a very short range technology."}, {"q": "Which is a common use of NFC?", "o": ["Connecting a laptop to a router 20 meters away", "Streaming video to a TV across a room", "Sharing a wired network connection", "Tap-to-pay at a point-of-sale terminal"], "a": 3, "e": "NFC is used for contactless payment and badge authentication."}, {"q": "Where are the camera and microphones usually located on a laptop?", "o": ["Camera top center, microphones on the left and right", "Camera on the left, microphones top center", "Camera at the bottom, microphones on the keyboard", "Camera on the lid back, microphones at the hinge"], "a": 0, "e": "Camera top center with mics on each side."}, {"q": "What does a modular laptop battery allow?", "o": ["Charging only while powered off", "Removal with a release button, then sliding a new one in", "Use of any battery from any model", "Replacement without any tools or alignment"], "a": 1, "e": "Modular batteries slide out with a release button."}, {"q": "Why must a replacement laptop battery match the make and model?", "o": ["Laptops will not boot with new batteries", "Any battery fits if the voltage label is similar", "Battery form factors differ between makes and models", "Only the color differs between models"], "a": 2, "e": "Form factors are model specific."}, {"q": "Which is a key benefit of upgrading an older laptop from an HDD to an SSD?", "o": ["Better speed and reliability", "Larger physical size", "Less storage than before always", "It adds a camera"], "a": 0, "e": "SSDs are faster and have no moving parts."}, {"q": "A laptop keyboard has stopped responding. How can the technician check whether the problem is hardware or OS?", "o": ["Replace the battery", "Flash the BIOS", "Replace the display", "Connect an external USB keyboard and test it"], "a": 3, "e": "An external keyboard separates internal hardware from OS faults."}, {"q": "An external USB keyboard works fine but the internal keyboard does not. What is the most likely problem?", "o": ["The wireless card", "The operating system", "The internal keyboard or its ribbon cable", "The USB controller"], "a": 2, "e": "The external one works, so the issue is internal."}, {"q": "A replacement battery does not fit the laptop. What is the most likely cause?", "o": ["The battery is too charged", "It is for a different make or model", "The battery needs a driver", "The laptop needs a BIOS update"], "a": 1, "e": "Battery form factors differ by model."}, {"q": "A user cannot remove the laptop battery. What does this mean?", "o": ["The battery is defective", "The laptop has no battery", "It is built in and a technician must open the laptop", "A release button is jammed"], "a": 2, "e": "Built-in batteries need the case opened."}, {"q": "A technician cannot find memory slots in a laptop that needs more RAM. What is the likely reason?", "o": ["The slots are on the display", "The memory is soldered to the system board", "RAM is stored on the SSD", "The memory is inside the keyboard"], "a": 1, "e": "Soldered memory is not upgradeable."}, {"q": "An older laptop with a spinning drive is slow. What is the most cost-effective upgrade?", "o": ["Replace the HDD with an SSD", "Add a second battery", "Replace the display", "Replace the keyboard"], "a": 0, "e": "An SSD is a big performance improvement for older laptops."}, {"q": "After a screen replacement, Wi-Fi and Bluetooth range is very weak. What should the technician check first?", "o": ["The battery latch", "The SO-DIMM seating", "The keyboard ribbon cable", "That the antenna wires are reconnected"], "a": 3, "e": "Antenna wires run around the display and must be reconnected."}, {"q": "A user wants fingerprint login but the option is missing. What should be checked?", "o": ["Whether a fingerprint reader exists and the OS supports it", "The antenna wires", "The size of the SSD", "The battery type"], "a": 0, "e": "Biometrics need hardware and OS support."}, {"q": "A technician replaces one keycap and the key will not click. What is the best approach in the future?", "o": ["Use thread lock on the key", "Replace the entire motherboard", "Press harder on the key", "Follow the manufacturer’s keycap steps; laptop keys are fragile"], "a": 3, "e": "Laptop keycaps are fragile."}, {"q": "A laptop has two SO-DIMM slots with one module installed. How is a second module added?", "o": ["Screw it into the system board", "Insert it into the M.2 slot", "Insert it into the empty slot and push until the clips lock", "Plug it into the USB port"], "a": 2, "e": "SO-DIMMs lock in with clips."}, {"q": "A user wants the old laptop’s programs and files on a new SSD with no reinstall. What should the technician use?", "o": ["A disk defragmenter", "Cloning software", "Windows Update", "A clean OS install"], "a": 1, "e": "Cloning creates an exact copy."}, {"q": "A user wants a higher quality image on video calls than the built-in camera gives. What is the best fix?", "o": ["Attach an external webcam", "Install more RAM", "Replace the keyboard", "Replace the battery"], "a": 0, "e": "An external webcam can be higher definition."}]}, {"id": "1.2(1)", "name": "1.2(1) Connecting Mobile Devices", "tag": "Messer 220-1201 notes", "blocks": [{"h": "TOPIC", "b": ["Connecting mobile devices: the wired and wireless ways a phone or tablet links to computers, power, and other devices (USB, Lightning, NFC, Bluetooth, hotspot, tethering)"]}, {"h": "OBJECTIVE", "b": ["Know every common mobile connection type and what it is used for", "Tell hotspot and tethering apart, and know which connector goes with which device"]}, {"h": "KEY POINTS", "r": [["WHY CONNECT", ["Connections do more than charge the battery", "Used for connectivity and data <b>synchronization<\/b>, for backing up the device, and for identifying it as yours", "Each device may use a different connection, so many cable types are in use"]], ["USB", ["<b>USB<\/b> (Universal Serial Bus): the most common way to connect mobile devices; the connectors have changed over time", "Older devices use <b>mini USB<\/b> and <b>micro USB<\/b> plugs (mini B, micro B); some devices in use today still do", "The computer end is often still a <b>USB Type-A<\/b> connector (desktop or laptop)"]], ["USB-C", ["Newer USB connector with <b>24 pins<\/b>", "<b>Reversible<\/b>: plugs in any orientation", "Replaces older USB 2.0 connections all the way up to the latest USB standard, and supports higher speeds", "Same connector can carry different signals: data, <b>DisplayPort<\/b>, <b>HDMI<\/b> (High-Definition Multimedia Interface) and <b>Thunderbolt<\/b> video"]], ["LIGHTNING", ["Apple’s <b>proprietary<\/b> connector, <b>8 pins<\/b>", "Used on older iPhone and iPad devices", "Added higher power output (faster charging) and can be inserted either way", "Many device types mean many cables: the trend is toward one USB-C connector type"]], ["NFC", ["<b>NFC<\/b> (Near-Field Communication): sends a little data over a very short connection", "Built into phones, tablets and smartwatches", "Uses: payments at a point-of-sale terminal, identification to open a door (wall sensor), transfer of information from one phone to another", "A phone can replace a separate ID or access card"]], ["BLUETOOTH", ["High-speed wireless over relatively short distances", "Called a <b>PAN<\/b> (Personal Area Network)", "Used for wireless headsets, keyboards, mice, and tethering a smartphone", "Designed for the individual, though multiple phones and devices can be linked"]], ["HOTSPOT", ["Phone acts as an internet router", "<b>Many<\/b> people or devices connect to the phone for internet access"]], ["TETHERING", ["Phone shares its internet with <b>only one<\/b> device", "That one device is the only one that can use the phone’s connection", "Hotspot and tethering depend on phone software and the carrier: ask the mobile provider if it is allowed"]]]}, {"h": "IMPORTANT CONCEPTS", "r": [["HOTSPOT VS TETHERING", ["Hotspot: many devices share the phone’s internet", "Tethering: exactly one device uses the phone’s internet"]], ["USB-C VS LIGHTNING", ["USB-C: 24 pins, reversible, universal standard, carries data and video", "Lightning: 8 pins, reversible, Apple-only, older iPhone and iPad"]], ["WIRED VS WIRELESS", ["Wired (USB, Lightning): charging, sync and backup", "Wireless (NFC, Bluetooth): payments, access, headsets, peripherals"]]]}, {"h": "FULL FORMS", "c": ["<b>USB<\/b> (Universal Serial Bus)", "<b>USB-C<\/b> (USB Type-C)", "<b>NFC<\/b> (Near-Field Communication)", "<b>PAN<\/b> (Personal Area Network)", "<b>HDMI<\/b> (High-Definition Multimedia Interface)", "<b>Lightning<\/b> (Apple proprietary 8-pin connector, not an acronym)", "<b>Bluetooth<\/b> (short-range wireless standard, not an acronym)", "<b>Thunderbolt<\/b> (high-speed connection technology, not an acronym)"]}, {"h": "EXAM FOCUS", "b": ["<b>USB-C<\/b>: 24 pins, reversible, higher speed, can carry video (DisplayPort, HDMI, Thunderbolt) as well as data", "<b>Lightning<\/b>: Apple proprietary, 8 pins, reversible, older iPhone and iPad", "Older devices: mini USB and micro USB; <b>Type-A<\/b> at the computer end", "<b>NFC<\/b>: payments, door access, phone-to-phone transfer; very short range", "<b>Bluetooth<\/b> = PAN: headsets, keyboards, mice", "<b>Hotspot<\/b> = many devices share the phone’s internet; <b>tethering<\/b> = one device", "Hotspot and tethering may need carrier approval"]}, {"h": "QUICK REVISION", "b": ["<b>USB:<\/b> mini / micro (older), Type-A (computer end), USB-C (24 pins, reversible, video capable)", "<b>Lightning:<\/b> Apple, 8 pins, older iPhone and iPad", "<b>NFC:<\/b> very short range, pay, access, transfer", "<b>Bluetooth:<\/b> PAN, headsets, keyboards, mice", "<b>Hotspot:<\/b> many devices; <b>tethering:<\/b> one device"]}], "probs": [["CANNOT USE HOTSPOT", ["Check the phone software and that the carrier plan allows hotspot or tethering: contact the mobile provider"]], ["WRONG CABLE", ["Different manufacturers use different connectors: match the plug to the device (mini B, micro B, USB-C, Lightning)", "Moving to USB-C reduces the number of cables to carry"]], ["SYNC OR BACKUP", ["Connect the device by cable to synchronize data or back it up"]]], "qs": [{"q": "How many pins does a USB-C connector have?", "o": ["9", "24", "15", "8"], "a": 1, "e": "USB-C has 24 pins."}, {"q": "How many pins does an Apple Lightning connector have?", "o": ["24", "15", "8", "4"], "a": 2, "e": "Lightning has 8 pins."}, {"q": "Which two connectors can be plugged in either orientation?", "o": ["Micro USB and mini USB", "Mini USB and USB Type-A", "USB Type-A and micro USB", "USB-C and Lightning"], "a": 3, "e": "Both USB-C and Lightning are reversible."}, {"q": "Which connector is Apple’s proprietary mobile connector used on older iPhones and iPads?", "o": ["Mini USB", "Lightning", "Micro USB", "USB-C"], "a": 1, "e": "Lightning is proprietary to Apple."}, {"q": "Which connector can carry data and also DisplayPort, HDMI or Thunderbolt video signals?", "o": ["USB-C", "Micro USB", "Lightning", "Mini USB"], "a": 0, "e": "USB-C can carry several signal types over one connector."}, {"q": "Older mobile devices commonly use which two USB plug types?", "o": ["USB-C and Lightning", "Type-A and Thunderbolt", "Mini USB and micro USB", "HDMI and DisplayPort"], "a": 2, "e": "Older devices use mini and micro USB."}, {"q": "Which USB connector type is commonly found at the computer end of a phone cable?", "o": ["Mini USB", "Lightning", "Micro USB", "USB Type-A"], "a": 3, "e": "The computer end is often Type-A."}, {"q": "What does NFC stand for?", "o": ["Near-Field Communication", "Near-Field Connection Cable", "Network Frequency Control", "Narrow File Channel"], "a": 0, "e": "NFC is Near-Field Communication."}, {"q": "Which is a common use of NFC on a phone?", "o": ["Charging the battery quickly", "Streaming video to a TV", "Making a payment at a point-of-sale terminal", "Sharing internet with ten devices"], "a": 2, "e": "NFC supports payments, door access and phone-to-phone transfer."}, {"q": "Which wireless technology forms a PAN and is used for headsets, keyboards and mice?", "o": ["NFC", "Bluetooth", "Cellular", "Wi-Fi Direct only"], "a": 1, "e": "Bluetooth is a Personal Area Network technology."}, {"q": "What is a mobile hotspot?", "o": ["A Bluetooth keyboard", "A cable that shares the screen", "A tool that charges the phone", "A phone acting as an internet router for many devices"], "a": 3, "e": "Hotspot lets many devices use the phone’s internet."}, {"q": "What is tethering?", "o": ["Sharing the phone’s internet with only one device", "Connecting only to Wi-Fi", "Sharing the phone’s internet with many devices", "Charging another phone from the battery"], "a": 0, "e": "Tethering connects a single device."}, {"q": "Besides charging, what else can a wired connection to a computer be used for?", "o": ["Cooling the processor", "Synchronization, backup, and identifying the device", "Increasing screen size", "Changing the SIM"], "a": 1, "e": "Wired connections carry data and identify the device."}, {"q": "What is the main advantage of USB-C over older USB connectors?", "o": ["It works only with Apple devices", "It has fewer pins than mini USB", "Higher speed and it can be inserted either way", "It is always wireless"], "a": 2, "e": "USB-C is faster and reversible."}, {"q": "What improvement did Lightning bring over older USB connectors?", "o": ["A larger 24-pin design", "Lower power output", "A single orientation only", "Higher power output and reversible insertion"], "a": 3, "e": "Lightning allows faster charging and either-way insertion."}, {"q": "Which technology lets a phone replace a separate ID badge to open a door?", "o": ["USB-C", "Tethering", "Hotspot", "NFC"], "a": 3, "e": "NFC supports access control with a phone."}, {"q": "A user cannot find the hotspot option on the phone. What should the technician check first?", "o": ["Whether the carrier plan allows hotspot or tethering", "The screen brightness", "The USB-C cable", "The Bluetooth headset"], "a": 0, "e": "Hotspot and tethering depend on the carrier."}, {"q": "A user carries a bag full of different charging cables. What is the best long-term fix?", "o": ["Disable charging", "Move to devices that use USB-C", "Use only mini USB", "Buy more Lightning cables"], "a": 1, "e": "One USB-C connector reduces the number of cable types."}, {"q": "An older Android phone uses a small flat micro plug. Which cable is needed?", "o": ["A USB-C cable", "A Lightning cable", "A micro USB cable", "An HDMI cable"], "a": 2, "e": "Match the plug to the device."}, {"q": "A user wants to back up a phone to a PC. What is a straightforward approach?", "o": ["Reset the phone", "Use NFC across the room", "Connect with a USB cable and use the sync or backup tool", "Use hotspot only"], "a": 2, "e": "Wired connections are used for sync and backup."}, {"q": "A smartwatch payment fails when held 20 cm from the terminal. What is the likely cause?", "o": ["NFC works only at very short range", "The watch needs a SIM card", "The cable is loose", "The terminal needs Bluetooth"], "a": 0, "e": "NFC range is about 4 cm or less."}, {"q": "A user wants a laptop to use only one phone’s internet connection. Which feature fits best?", "o": ["Airplane mode", "Tethering", "Hotspot with many devices", "NFC"], "a": 1, "e": "Tethering shares with a single device."}]}, {"id": "1.2(2)", "name": "1.2(2) Mobile Device Accessories", "tag": "Messer 220-1201 notes", "blocks": [{"h": "TOPIC", "b": ["Mobile device accessories: stylus, headsets, speakers, webcams, docking stations, port replicators, trackpads and drawing pads"]}, {"h": "OBJECTIVE", "b": ["Know what each accessory does and how it connects (Bluetooth, USB, Lightning, analog jack)", "Choose between a docking station and a port replicator"]}, {"h": "KEY POINTS", "r": [["STYLUS", ["Gives more precise input than a finger, like using a pen or pencil", "Usually connects over <b>Bluetooth<\/b> (wireless)", "Often has pressure sensitivity and buttons for extra functions", "Must be <b>compatible<\/b> with the device (for example, Apple Pencil with an Apple tablet): a matched pair gives the best connection and most features"]], ["WIRED HEADSET", ["Hands-free: speaker plus microphone", "Connection types: <b>USB<\/b>, the older analog <b>TRRS<\/b> connector, or <b>Lightning<\/b> on older iPhones", "TRRS = <b>Tip-Ring-Ring-Sleeve<\/b>: commonly the 3.5 mm analog audio jack", "TRRS has the tip, two ring contacts in the middle, and the sleeve closest to the back"]], ["WIRELESS HEADSET", ["No wires: battery powered, connects over <b>Bluetooth<\/b>", "If the battery runs out during the day, switch to a wired headset"]], ["SPEAKERS", ["Phone speakers have limited fidelity", "Wireless speakers: battery powered, portable, connect over <b>Bluetooth<\/b>", "Can be moved anywhere within range of the phone"]], ["WEBCAMS", ["Phones, tablets and many laptops already have a built-in camera", "Computers without one can use an external third-party webcam, usually over <b>USB<\/b>", "Used to capture audio and video or for video and audio conferencing"]], ["DOCKING STATION", ["Connect and disconnect a laptop without touching the desk cables (video, mouse, keyboard, network)", "Often adds extra interface options and can even take <b>full-size interface cards<\/b>", "Made for a specific laptop: place the laptop on it and start working; lift it off at the end of the day and leave the cables in place"]], ["PORT REPLICATOR", ["Similar to a docking station but <b>no support for adapter cards<\/b>", "More portable and not tied to one laptop: usually connects over <b>USB<\/b> to almost any laptop or desktop", "Typical ports: USB, audio, video output, microSD and SD card readers"]], ["TRACKPAD", ["Built into laptops: mouse functions in a confined space using your fingers", "External trackpad for a desktop: battery powered, connects over <b>Bluetooth<\/b>", "Supports multi-finger gestures (expand and contract) that are hard with a mouse", "Many laptops can disable it with a <b>function key<\/b> (example: F10) to avoid accidental clicks while typing"]], ["DRAWING PAD", ["External <b>digitizer<\/b> with its own stylus: tablet-style precise input on a desktop or laptop", "Usually third party; connects over <b>Bluetooth<\/b> or <b>USB<\/b>", "Good for artistic input"]]]}, {"h": "IMPORTANT CONCEPTS", "r": [["DOCK VS REPLICATOR", ["Docking station: laptop specific, supports adapter cards, larger", "Port replicator: no cards, portable, USB, works with almost any computer"]], ["WIRED VS WIRELESS AUDIO", ["Wired: USB, TRRS 3.5 mm analog jack, Lightning, never runs out of battery", "Wireless: Bluetooth, battery powered, more freedom"]], ["TRACKPAD VS MOUSE", ["Trackpad: built in, finger gestures, can be disabled with a function key", "Mouse: external, takes more room"]]]}, {"h": "FULL FORMS", "c": ["<b>TRRS<\/b> (Tip-Ring-Ring-Sleeve)", "<b>USB<\/b> (Universal Serial Bus)", "<b>SD<\/b> (Secure Digital (card))", "<b>microSD<\/b> (micro Secure Digital (card))", "<b>Fn<\/b> (Function key)", "<b>Bluetooth<\/b> (short-range wireless standard, not an acronym)", "<b>Lightning<\/b> (Apple proprietary connector, not an acronym)", "<b>mm<\/b> (millimeter)"]}, {"h": "EXAM FOCUS", "b": ["Stylus: Bluetooth, pressure sensitivity, buttons, must be compatible with the device", "Wired headset connectors: <b>USB<\/b>, <b>TRRS<\/b> 3.5 mm analog jack, <b>Lightning<\/b> (older iPhone)", "<b>TRRS<\/b> = Tip-Ring-Ring-Sleeve (two rings in the middle)", "Wireless headsets, speakers and external trackpads use <b>Bluetooth<\/b>", "External webcams commonly use <b>USB<\/b>", "<b>Docking station<\/b>: laptop specific, can hold adapter cards; <b>port replicator<\/b>: no cards, portable, usually USB", "Trackpad can be disabled with a function key", "<b>Drawing pad<\/b>: external digitizer with a stylus, Bluetooth or USB"]}, {"h": "QUICK REVISION", "b": ["<b>Stylus:<\/b> Bluetooth, pressure, must be compatible", "<b>Headsets:<\/b> USB / TRRS 3.5 mm / Lightning wired; Bluetooth wireless", "<b>Webcam:<\/b> external, usually USB", "<b>Dock:<\/b> laptop specific, supports cards; <b>port replicator:<\/b> USB, portable, no cards", "<b>Trackpad:<\/b> gestures, disable with function key", "<b>Drawing pad:<\/b> digitizer with stylus, Bluetooth or USB"]}], "probs": [["STYLUS PROBLEMS", ["Check that the stylus is compatible with the device and paired over Bluetooth"]], ["HEADSET DEAD", ["Wireless headset out of battery: switch to the wired version"]], ["ACCIDENTAL CLICKS", ["Disable the trackpad with the function key while typing"]], ["DAILY UNPLUGGING", ["Use a docking station instead of unplugging every cable each day"]], ["NO CAMERA", ["Desktop or laptop without a camera: add an external USB webcam"]], ["WEAK PHONE SOUND", ["Use a Bluetooth wireless speaker for better fidelity"]]], "qs": [{"q": "How does a stylus usually connect to a tablet?", "o": ["Lightning only", "Ethernet", "HDMI", "Bluetooth"], "a": 3, "e": "Styluses commonly use Bluetooth."}, {"q": "What should be checked before buying a stylus for a tablet?", "o": ["That it is compatible with the device", "The color of the stylus", "The length of the USB cable", "The battery size of the tablet"], "a": 0, "e": "A matched stylus gives the best connection and features."}, {"q": "What does TRRS stand for?", "o": ["Terminal-Ring-Receive-Sleeve", "Tip-Receive-Ring-Switch", "Transmit-Receive-Ring-Signal", "Tip-Ring-Ring-Sleeve"], "a": 3, "e": "TRRS is Tip-Ring-Ring-Sleeve."}, {"q": "Which wired headset connector is the common 3.5 mm analog jack?", "o": ["Thunderbolt", "TRRS", "USB-C only", "HDMI"], "a": 1, "e": "The 3.5 mm analog jack is a TRRS connector."}, {"q": "Which wired headset connection is used on older iPhones?", "o": ["DisplayPort", "TRRS 6.35 mm", "Lightning", "Micro USB"], "a": 2, "e": "Older iPhones use Lightning headsets."}, {"q": "How does a typical wireless headset connect?", "o": ["Bluetooth", "Ethernet", "Serial port", "IR only"], "a": 0, "e": "Wireless headsets use Bluetooth."}, {"q": "Which accessory can support full-size interface cards for a specific laptop?", "o": ["Port replicator", "Drawing pad", "Webcam", "Docking station"], "a": 3, "e": "Docks can take full-size adapter cards."}, {"q": "Which accessory is portable, usually connects by USB and works with almost any laptop or desktop but takes no adapter cards?", "o": ["Stylus", "Trackpad", "Port replicator", "Docking station"], "a": 2, "e": "A port replicator has no adapter card support."}, {"q": "Which ports are typical on a port replicator?", "o": ["Only Bluetooth", "USB, audio, video output and SD or microSD card readers", "Only a power cord", "Only PS/2"], "a": 1, "e": "Replicators add common ports."}, {"q": "How can many laptops stop accidental clicks from a built-in trackpad while typing?", "o": ["Change the SIM", "Close all apps", "Disable the trackpad with a function key", "Remove the battery"], "a": 2, "e": "A function key can turn the trackpad off."}, {"q": "How does an external trackpad for a desktop typically connect?", "o": ["HDMI", "Bluetooth", "SATA", "VGA"], "a": 1, "e": "External trackpads are battery powered and use Bluetooth."}, {"q": "What is a drawing pad?", "o": ["A wireless speaker", "A kind of docking station", "A built-in laptop camera", "An external digitizer with its own stylus for precise input"], "a": 3, "e": "It is used for artistic input."}, {"q": "How does an external webcam commonly connect to a computer?", "o": ["USB", "HDMI", "SATA", "TRRS"], "a": 0, "e": "External webcams usually use USB."}, {"q": "Which accessory gives better sound than a phone’s small speaker and is battery powered?", "o": ["A stylus", "A port replicator", "A wireless Bluetooth speaker", "A drawing pad"], "a": 2, "e": "Wireless speakers are portable and use Bluetooth."}, {"q": "What does a docking station let a user do?", "o": ["Increase battery size", "Charge a phone wirelessly", "Replace the SSD", "Connect or disconnect a laptop from desk devices quickly"], "a": 3, "e": "Docks avoid plugging and unplugging each cable."}, {"q": "Which feature makes multi-finger gestures easy on a laptop?", "o": ["Drawing pad only", "Trackpad", "Port replicator", "TRRS jack"], "a": 1, "e": "Trackpads support multi-finger gestures."}, {"q": "A stylus will not work with a tablet. What should the technician check first?", "o": ["Whether the stylus is compatible and paired over Bluetooth", "The SIM card", "The SO-DIMM seating", "The port replicator"], "a": 0, "e": "Compatibility and pairing come first."}, {"q": "A wireless headset battery dies in the middle of the day. What is the simplest fix?", "o": ["Switch to a wired headset", "Replace the SSD", "Use a stylus", "Reinstall the OS"], "a": 0, "e": "A wired headset needs no battery."}, {"q": "A laptop cursor jumps while typing. What is the easiest fix?", "o": ["Replace the memory", "Install a port replicator", "Disable the trackpad with the function key", "Change the SIM"], "a": 2, "e": "Accidental palm touches cause cursor jumps."}, {"q": "A user unplugs five cables from a laptop every evening. What is the best solution?", "o": ["Buy a drawing pad", "Use a stylus", "Replace the battery", "Use a docking station"], "a": 3, "e": "A dock reconnects everything at once."}, {"q": "A desktop has no camera but the user needs video conferencing. What is the solution?", "o": ["Add a Lightning cable", "Add an external USB webcam", "Add a docking station", "Add a stylus"], "a": 1, "e": "External webcams add a camera."}, {"q": "A traveler needs an SD card reader and extra USB ports but no adapter cards. What fits best?", "o": ["Stylus", "Port replicator", "Drawing pad", "Trackpad"], "a": 1, "e": "Port replicators are portable and add common ports."}, {"q": "A phone speaker sounds thin. What is the best low-cost improvement?", "o": ["Use a Bluetooth wireless speaker", "Disable the trackpad", "Replace the SIM", "Use a stylus"], "a": 0, "e": "A wireless speaker provides better fidelity."}]}, {"id": "1.3(1)", "name": "1.3(1) Mobile Device Networks", "tag": "Messer 220-1201 notes", "blocks": [{"h": "TOPIC", "b": ["Mobile device networks: cellular (3G, 4G, 5G), Wi-Fi, hotspot, SIM and eSIM, Bluetooth pairing, and GPS"]}, {"h": "OBJECTIVE", "b": ["Know the cellular generations and their speeds, and how a phone identifies itself on a carrier network", "Know the Bluetooth pairing steps and how location is found"]}, {"h": "KEY POINTS", "r": [["CELLULAR NETWORK", ["Land is divided into <b>cells<\/b>, each covered by antennas using several frequencies", "Provides both voice and data; cellular data can be turned on or off", "<b>Airplane mode<\/b> disables all communication on the device; you then pick which ones to turn back on"]], ["3G", ["Started taking off in 1998", "Allowed larger amounts of data: GPS functions, mobile television, video on demand, video conferencing"]], ["4G AND LTE", ["Upgrade from 3G; often called <b>LTE<\/b> (Long-Term Evolution)", "Based on <b>GSM<\/b> (Global System for Mobile Communications); also mentioned: <b>EDGE<\/b> (Enhanced Data rates for GSM Evolution)", "Bandwidth up to <b>150 Mbps<\/b>"]], ["LTE ADVANCED", ["<b>LTE-A<\/b>: upgrade of LTE", "Throughput up to <b>300 Mbps<\/b>"]], ["5G", ["Fifth generation, introduced in <b>2020<\/b>", "Higher frequencies support up to <b>10 Gbps<\/b>; other frequencies about <b>100 to 900 Mbps<\/b>", "Lots of bandwidth for one device: helps <b>IoT<\/b> (Internet of Things), faster notifications, and more data sent to the cloud"]], ["WI-FI (802.11)", ["High-speed wireless, no wired connection, but <b>limited range<\/b>", "Everyone connects through a local access point", "Carries voice, video and data; phones can make calls over Wi-Fi when 4G or 5G signal is weak"]], ["HOTSPOT", ["Phone connects to the cellular network (for example 5G) and shares it with other devices over 802.11", "Built into the phone software but the <b>carrier must allow it<\/b>: some do not, some charge extra"]], ["SIM", ["<b>SIM<\/b> (Subscriber Identity Module): usually a physical card that identifies the phone on the mobile network", "Holds carrier and subscriber information, a SIM ID, phone number, network information, and storage for contacts and messages", "Move the SIM to another phone and the number moves with it", "Small cards often need a special tool; some phones support multiple SIMs (multiple numbers or profiles)"]], ["ESIM", ["<b>eSIM<\/b>: embedded SIM, a physical part of the phone that cannot be unplugged", "Moved with phone software: choose add or move eSIM, then transfer from an existing phone or use a <b>QR code<\/b>", "Makes transfers between devices much easier"]], ["BLUETOOTH PAIRING", ["Pair once per device; afterwards connect and disconnect freely", "Step 1: enable Bluetooth on both devices (iOS or Android: Settings, then Bluetooth)", "Step 2: put both in <b>discoverable<\/b> mode (may need a key sequence, check the documentation)", "Step 3: select the device on the phone to start pairing", "Step 4: confirm or type the <b>PIN<\/b> (Personal Identification Number), fixed or changing each time", "Step 5: test by powering one device off and on: it should reconnect automatically"]], ["GPS", ["<b>GPS<\/b> (Global Positioning System): created by the United States Department of Defense; uses satellites circling the Earth", "Needs to see <b>four satellites<\/b> for accurate readings", "Signal differences give longitude, latitude, and altitude above sea level", "Other location methods: nearby <b>Wi-Fi networks<\/b> and <b>triangulation<\/b> from cellular towers"]]]}, {"h": "IMPORTANT CONCEPTS", "r": [["SPEED LADDER", ["3G: larger data, GPS, mobile TV, video", "4G LTE: up to 150 Mbps", "LTE-A: up to 300 Mbps", "5G: up to 10 Gbps (higher frequencies), 100 to 900 Mbps (other frequencies)"]], ["SIM VS ESIM", ["SIM: physical card, can be removed and moved", "eSIM: built in, transferred through software or a QR code"]], ["HOTSPOT VS WI-FI CALLING", ["Hotspot: phone shares its cellular connection with other devices", "Wi-Fi calling: phone uses a Wi-Fi network for calls when cellular signal is poor"]]]}, {"h": "FULL FORMS", "c": ["<b>3G / 4G / 5G<\/b> (third / fourth / fifth generation)", "<b>LTE<\/b> (Long-Term Evolution)", "<b>LTE-A<\/b> (LTE Advanced)", "<b>GSM<\/b> (Global System for Mobile Communications)", "<b>EDGE<\/b> (Enhanced Data rates for GSM Evolution)", "<b>IoT<\/b> (Internet of Things)", "<b>SIM<\/b> (Subscriber Identity Module)", "<b>eSIM<\/b> (embedded SIM)", "<b>PIN<\/b> (Personal Identification Number)", "<b>GPS<\/b> (Global Positioning System)", "<b>Mbps<\/b> (megabits per second)", "<b>Gbps<\/b> (gigabits per second)", "<b>QR<\/b> (Quick Response (code))", "<b>802.11<\/b> (IEEE wireless LAN standard (Wi-Fi))"]}, {"h": "EXAM FOCUS", "b": ["Order and speed: 3G, then <b>4G LTE (up to 150 Mbps)<\/b>, then <b>LTE-A (up to 300 Mbps)<\/b>, then <b>5G (up to 10 Gbps)<\/b>", "<b>Airplane mode<\/b> disables all wireless communication; individual ones can be turned back on", "<b>SIM<\/b> holds subscriber, carrier and phone number information; moving it moves the number", "<b>eSIM<\/b> is built in and transferred with software or a QR code", "<b>Hotspot<\/b> needs carrier permission and may cost extra", "Bluetooth pairing: enable, discoverable, select, confirm <b>PIN<\/b>, test reconnect; pair only once", "<b>GPS<\/b> needs <b>four satellites<\/b>; backups are Wi-Fi location and cell tower triangulation", "Wi-Fi calling works when 4G or 5G signal is weak"]}, {"h": "QUICK REVISION", "b": ["<b>Cellular:<\/b> 3G, 4G LTE 150 Mbps, LTE-A 300 Mbps, 5G up to 10 Gbps", "<b>Airplane mode:<\/b> turns everything off, then enable what you need", "<b>SIM:<\/b> card with carrier and subscriber info; <b>eSIM:<\/b> built in, QR code transfer", "<b>Hotspot:<\/b> phone shares cellular over 802.11, carrier must allow", "<b>Bluetooth pairing:<\/b> enable, discoverable, select, PIN, test", "<b>GPS:<\/b> four satellites; backups Wi-Fi and cell triangulation"]}], "probs": [["POOR CELL SIGNAL", ["Use Wi-Fi calling over a Wi-Fi network to send and receive calls"]], ["HOTSPOT FAILS", ["The carrier may not allow it or may charge extra: check with the mobile carrier"]], ["BLUETOOTH WILL NOT PAIR", ["Both devices must be discoverable (may need a key sequence)", "Check the documentation for the PIN and enter or confirm it"]], ["NO AUTO RECONNECT", ["Power one device off and on to test; if it fails, repeat the pairing"]], ["GPS NOT WORKING", ["Fewer than four satellites in view: use Wi-Fi location or cell tower triangulation"]], ["NEW PHONE", ["Physical SIM: move the card to the new phone", "eSIM: transfer with phone software or a QR code"]]], "qs": [{"q": "What does LTE stand for?", "o": ["Low-Tier Ethernet", "Local Transmission Extension", "Long-Term Encryption", "Long-Term Evolution"], "a": 3, "e": "LTE is Long-Term Evolution."}, {"q": "What is the bandwidth of 4G LTE?", "o": ["Up to 1 Mbps", "Up to 10 Gbps", "Up to 150 Mbps", "Up to 300 Mbps"], "a": 2, "e": "LTE offers up to 150 Mbps."}, {"q": "What is the throughput of LTE-A?", "o": ["Up to 150 Mbps", "Up to 54 Mbps", "Up to 10 Gbps", "Up to 300 Mbps"], "a": 3, "e": "LTE Advanced reaches up to 300 Mbps."}, {"q": "What is the top speed of 5G on higher frequencies?", "o": ["Up to 100 Mbps", "Up to 150 Mbps", "Up to 10 Gbps", "Up to 300 Mbps"], "a": 2, "e": "5G can reach 10 Gbps on higher frequencies."}, {"q": "What speed range does 5G offer on other frequencies?", "o": ["About 20 to 40 Mbps", "About 100 to 900 Mbps", "About 50 to 100 Gbps", "About 1 to 5 Mbps"], "a": 1, "e": "Other 5G frequencies give 100 to 900 Mbps."}, {"q": "Which 5G benefit helps IoT devices and faster notifications?", "o": ["Large bandwidth for each device", "Shorter SIM cards", "Wired connections", "Lower power for the screen"], "a": 0, "e": "5G supports many devices with high bandwidth."}, {"q": "What does GSM stand for?", "o": ["Global System for Mobile Communications", "General Signal Mobile", "Global Satellite Messaging", "Grid System for Mobile Radio"], "a": 0, "e": "4G LTE is based on GSM."}, {"q": "What does SIM stand for?", "o": ["Secure Internet Module", "Subscriber Internet Mobile", "Subscriber Identity Module", "Signal Input Memory"], "a": 2, "e": "A SIM identifies the phone on the carrier network."}, {"q": "What information can a SIM hold?", "o": ["Only photos", "The BIOS", "The operating system", "Carrier and subscriber information, a phone number and contacts or messages"], "a": 3, "e": "SIMs hold subscriber and network information."}, {"q": "What happens to the phone number if the SIM is moved to another phone?", "o": ["The number is deleted", "The number moves with the SIM", "The number becomes an eSIM", "The number stays on the old phone"], "a": 1, "e": "The SIM carries the number."}, {"q": "What is an eSIM?", "o": ["An embedded SIM that is a physical part of the phone and is transferred with software", "A removable card with a tiny screw", "A type of microSD card", "A second battery"], "a": 0, "e": "eSIMs are moved with software or a QR code."}, {"q": "How can a user transfer an eSIM to another phone?", "o": ["Replace the motherboard", "Use phone software, an existing phone, or a QR code", "Use an HDMI cable", "Remove the card with a tool"], "a": 1, "e": "eSIM transfer is done with software."}, {"q": "What is the benefit of a phone that supports multiple SIMs?", "o": ["Longer battery life", "More storage", "Faster screen refresh", "Multiple numbers or profiles on one phone"], "a": 3, "e": "Dual SIM allows several profiles."}, {"q": "What does airplane mode do?", "o": ["Locks the screen only", "Turns off the camera", "Disables all communication on the device", "Closes all apps"], "a": 2, "e": "You can then enable individual features."}, {"q": "Which feature lets a phone make calls over a Wi-Fi network when cellular signal is weak?", "o": ["Bluetooth pairing", "Wi-Fi calling", "NFC", "Tethering"], "a": 1, "e": "Wi-Fi calling uses 802.11 for voice."}, {"q": "What does a mobile hotspot do?", "o": ["Disables Bluetooth", "Increases cellular tower power", "Shares the phone’s cellular connection with other devices over 802.11", "Moves the SIM to another phone"], "a": 2, "e": "A hotspot shares the phone’s cellular data."}, {"q": "Which is the correct order for pairing Bluetooth devices?", "o": ["Enable Bluetooth, make discoverable, select the device, confirm the PIN, test the connection", "Make discoverable, test, enable Bluetooth, select the device, confirm the PIN", "Confirm the PIN, enable Bluetooth, select the device, make discoverable, test", "Select the device, test, enable Bluetooth, confirm the PIN, make discoverable"], "a": 0, "e": "Enable, discoverable, select, PIN, test."}, {"q": "How often must two Bluetooth devices be paired?", "o": ["Once a day", "Only after a factory reset", "Every time they connect", "Once, then they can connect and disconnect freely"], "a": 3, "e": "Pairing is done once per device."}, {"q": "What does PIN stand for?", "o": ["Protected Input Network", "Personal Identification Number", "Private Internet Node", "Paired Interface Number"], "a": 1, "e": "A PIN may be fixed or change each time."}, {"q": "How many satellites must GPS see for accurate readings?", "o": ["Four", "Two", "One", "Eight"], "a": 0, "e": "GPS needs four satellites."}, {"q": "Which three values does GPS provide?", "o": ["SSID, IP and MAC", "Speed, battery and heading", "Temperature, speed and pressure", "Longitude, latitude and altitude"], "a": 3, "e": "GPS gives location and altitude."}, {"q": "Which organization created GPS?", "o": ["NASA only", "European Space Agency", "United States Department of Defense", "Federal Communications Commission"], "a": 2, "e": "GPS was created by the US DoD."}, {"q": "Which other methods can a phone use to find its location besides GPS?", "o": ["HDMI signals", "Bluetooth keyboards and USB hubs", "NFC tags only", "Nearby Wi-Fi networks and cell tower triangulation"], "a": 3, "e": "Wi-Fi and cell towers provide alternate location data."}, {"q": "How is a cellular network structured?", "o": ["Land divided into cells, each covered by antennas", "Wired switches in each phone", "One huge antenna covering a country", "A single Wi-Fi access point"], "a": 0, "e": "Cellular networks are made of cells."}, {"q": "Which generation of cellular technology is commonly called LTE?", "o": ["5G", "2G", "4G", "3G"], "a": 2, "e": "4G is commonly called LTE."}, {"q": "A user has poor cellular signal inside a building but wants to make calls. What is the best option?", "o": ["Use NFC", "Use Wi-Fi calling", "Use airplane mode", "Use tethering"], "a": 1, "e": "Wi-Fi calling carries voice over 802.11."}, {"q": "A phone’s hotspot option is unavailable. What should be checked first?", "o": ["The SIM tray color", "The stylus battery", "Whether the carrier allows hotspot and any extra charge applies", "The headset jack"], "a": 2, "e": "Carriers may block or charge for hotspot."}, {"q": "A Bluetooth speaker does not appear in the phone’s device list. What is the most likely issue?", "o": ["The speaker is not in discoverable mode", "The SIM card is full", "GPS is off", "The phone is on 5G"], "a": 0, "e": "Both devices must be discoverable."}, {"q": "A paired Bluetooth device does not reconnect after a power cycle. What should the technician do?", "o": ["Disable GPS", "Repeat the pairing process", "Replace the SIM", "Turn on airplane mode permanently"], "a": 1, "e": "If it fails to reconnect, pair again."}, {"q": "A phone cannot get a GPS lock indoors. What is the likely cause?", "o": ["The SIM is the wrong size", "Bluetooth is on", "The battery is Li-ion", "Fewer than four satellites are in view"], "a": 3, "e": "GPS needs four satellites; Wi-Fi or cell data can help."}, {"q": "A user buys a new phone and wants to keep the same number with a physical SIM. What should be done?", "o": ["Reset the old phone", "Move the SIM to the new phone", "Use a hotspot", "Pair it by Bluetooth"], "a": 1, "e": "The SIM carries the number."}, {"q": "A user’s new phone uses an eSIM. How can the number be moved?", "o": ["Replace the battery", "Connect a USB-C cable only", "Insert a tool into the tray", "Transfer it with software or a QR code"], "a": 3, "e": "eSIMs are transferred through software."}, {"q": "Technicians need the PIN for a Bluetooth device and do not know it. Where should they look?", "o": ["The SIM card", "The display brightness setting", "The device documentation", "The GPS menu"], "a": 2, "e": "Documentation lists the PIN and discoverable steps."}]}, {"id": "1.3(2)", "name": "1.3(2) Mobile Device Management", "tag": "Messer 220-1201 notes", "blocks": [{"h": "TOPIC", "b": ["Mobile device management: MDM, device ownership models (BYOD, COPE, CYOD), data synchronization, and business application setup"]}, {"h": "OBJECTIVE", "b": ["Know what an MDM controls and how ownership models differ", "Know how synchronization and business accounts are configured and limited"]}, {"h": "KEY POINTS", "r": [["MDM", ["<b>MDM<\/b> (Mobile Device Management): central place to manage all the mobile phones in an organization", "Manages company-owned and personally owned devices; needs specialized software", "Admin sets rules: which apps are allowed or not allowed; enable or disable functions such as camera or GPS", "Can <b>partition<\/b> a personal phone: private personal data separate from corporate data", "Security policies: for example require a screen lock with a PIN"]], ["BYOD", ["<b>BYOD<\/b> (Bring Your Own Device), also called bring your own technology", "Employee owns the phone: simpler, no second phone to carry", "Challenge: protect company data while keeping personal information private", "MDM defines the home (private) part and the work part, how data is protected, and what happens to the data if the phone is upgraded, traded in or lost"]], ["COPE", ["<b>COPE<\/b> (Corporate Owned, Personally Enabled)", "Company buys the phone, assigns it to a user, and manages it as a corporate device with <b>full control<\/b>", "Many organizations still let the user use it personally", "Managed like laptops and desktops: company decides what data is stored and what happens to it if the device is replaced or lost"]], ["CYOD", ["<b>CYOD<\/b> (Choose Your Own Device)", "User chooses from a selection of company-approved devices"]], ["MDM POLICIES", ["Push corporate email settings to every phone: users just turn on the phone and it works", "Require extra security such as two-factor or multifactor authentication", "Decide which apps are allowed or forbidden, and push apps to install automatically"]], ["MDM CONSOLE", ["Lists devices: device name, platform, username, email and contact info, and the <b>IMEI<\/b> (unique identifier)", "Drill down: OS version, device security options enabled or disabled, network summary", "<b>Restrictions<\/b> tab: enable or disable camera, FaceTime, voice dialing, Siri, plus security, printing and application options"]], ["DATA SYNC", ["Done <b>over the air<\/b>, since phones are rarely plugged in to a central facility", "Also the way data is backed up and restored if a device fails, is damaged or replaced", "Choose Wi-Fi only or allow the cellular network too (cost limits: some organizations sync only over 802.11 or a local network)", "Choose which data types sync (calendar, contacts and so on) and even change it by time of day", "Cellular settings can limit usage and automatic downloads, including the size of apps allowed over the mobile network: check the carrier contract"]], ["BUSINESS APPS", ["Set up email, cloud storage and other services in the device account settings", "Needs a username, password or other authentication factor", "Choose exactly what syncs: mail, contacts, calendars, reminders, notes", "Settings can differ per service (Microsoft Exchange versus Google Mail)"]]]}, {"h": "IMPORTANT CONCEPTS", "r": [["OWNERSHIP MODELS", ["BYOD: employee owns it", "COPE: company owns it, user may use it personally", "CYOD: user picks from a company list"]], ["PARTITIONING", ["Personal data stays private to the user", "Corporate data sits in its own protected area on the same phone"]], ["WI-FI ONLY SYNC", ["Saves cellular data and cost", "Sync happens only when connected to an 802.11 or local network"]]]}, {"h": "FULL FORMS", "c": ["<b>MDM<\/b> (Mobile Device Management)", "<b>BYOD<\/b> (Bring Your Own Device)", "<b>COPE<\/b> (Corporate Owned, Personally Enabled)", "<b>CYOD<\/b> (Choose Your Own Device)", "<b>IMEI<\/b> (International Mobile Equipment Identity)", "<b>PIN<\/b> (Personal Identification Number)", "<b>2FA<\/b> (Two-Factor Authentication)", "<b>MFA<\/b> (Multifactor Authentication)", "<b>OS<\/b> (Operating System)", "<b>802.11<\/b> (IEEE wireless LAN standard (Wi-Fi))"]}, {"h": "EXAM FOCUS", "b": ["<b>MDM<\/b> centrally controls apps, camera, GPS, security policies and partitions work and personal data", "<b>BYOD<\/b> = employee owns; <b>COPE<\/b> = company owns, personal use allowed; <b>CYOD<\/b> = user chooses from a list", "MDM can require a <b>screen lock with PIN<\/b> and two-factor or multifactor authentication", "MDM can <b>push email settings<\/b> and apps, and forbid apps", "<b>IMEI<\/b> is the unique device identifier shown in the MDM console", "Sync is done over the air; choose <b>Wi-Fi only<\/b> or cellular, and which data types sync", "Set policies for what happens to data when a device is upgraded, traded in or lost"]}, {"h": "QUICK REVISION", "b": ["<b>MDM:<\/b> one console for apps, restrictions, security, sync", "<b>BYOD:<\/b> own device; <b>COPE:<\/b> company device, personal use ok; <b>CYOD:<\/b> choose from list", "<b>Partition:<\/b> personal data private, corporate data protected", "<b>Security:<\/b> screen lock with PIN, 2FA / MFA, allowed and forbidden apps", "<b>Sync:<\/b> over the air, Wi-Fi only or cellular, per data type", "<b>IMEI:<\/b> unique device ID in the console"]}], "probs": [["LOST OR TRADED IN", ["Have policies ready for corporate data when a device is lost, upgraded or traded in"]], ["MANUAL EMAIL SETUP", ["Push email settings from the MDM so users do not have to configure anything"]], ["HIGH CELLULAR COST", ["Limit sync to Wi-Fi only and restrict automatic download size over the mobile network"]], ["DEVICE RESTORE", ["Synchronization settings decide what can be restored on a replacement phone"]], ["UNWANTED FEATURES", ["Use the MDM Restrictions tab or forbid apps instead of fixing each phone by hand"]], ["IDENTIFY A DEVICE", ["Look up the IMEI in the MDM console"]]], "qs": [{"q": "What does MDM stand for?", "o": ["Mobile Device Management", "Mobile Data Module", "Managed Device Memory", "Multi-Device Messaging"], "a": 0, "e": "MDM centrally manages mobile devices."}, {"q": "What does BYOD stand for?", "o": ["Bring Your Own Device", "Back Up Your Own Data", "Build Your Own Domain", "Bring Your Offline Disk"], "a": 0, "e": "The employee owns the phone."}, {"q": "What does COPE stand for?", "o": ["Company Owned, Partly Encrypted", "Corporate Owned, Personally Enabled", "Corporate Only, Personal Exempt", "Controlled Open Personal Equipment"], "a": 1, "e": "The company owns and manages the device."}, {"q": "What does CYOD stand for?", "o": ["Control Your Owned Domain", "Connect Your Open Device", "Choose Your Own Device", "Change Your Online Data"], "a": 2, "e": "Users pick from a company-approved list."}, {"q": "Which model has the company buy, assign and fully control the device while allowing personal use?", "o": ["BYOD", "MDM only", "CYOD", "COPE"], "a": 3, "e": "COPE gives the company full control."}, {"q": "Which model has the employee own the phone and use it for work?", "o": ["BYOD", "CYOD", "COPE", "ROAM"], "a": 0, "e": "BYOD uses the employee’s own device."}, {"q": "Which model lets the user choose from a set of approved devices?", "o": ["BYOD", "COPE", "CYOD", "MDM"], "a": 2, "e": "CYOD offers a company-approved choice."}, {"q": "Which technology can separate personal data from corporate data on one phone?", "o": ["Airplane mode", "MDM partitioning", "NFC", "Tethering"], "a": 1, "e": "MDM can partition work and home data."}, {"q": "What can MDM push to a user’s phone?", "o": ["A new screen", "A new battery", "A new SIM", "Email settings and apps"], "a": 3, "e": "MDM pushes settings and apps."}, {"q": "Which security policy can MDM enforce on a phone?", "o": ["Disabling the case", "Removing the antenna", "Requiring a screen lock with a PIN", "Changing the SIM size"], "a": 2, "e": "Screen locks are a typical MDM policy."}, {"q": "What is the IMEI?", "o": ["The phone’s Wi-Fi name", "A unique device identifier shown in the MDM console", "The speed of the LTE signal", "A password for email"], "a": 1, "e": "IMEI is International Mobile Equipment Identity."}, {"q": "What can the MDM Restrictions tab control?", "o": ["Features such as the camera, FaceTime, voice dialing and Siri", "The battery chemistry", "The screen size", "The SIM tray"], "a": 0, "e": "Restrictions enable or disable features."}, {"q": "What does synchronization over the air mean?", "o": ["Data syncs only on desktops", "Data syncs by NFC taps", "Data syncs only by USB cable", "Data syncs wirelessly because phones are rarely plugged in centrally"], "a": 3, "e": "OTA sync fits mobile use."}, {"q": "Why might an organization allow sync only over Wi-Fi?", "o": ["To speed up the camera", "To remove the SIM", "To increase screen brightness", "To avoid cellular data costs"], "a": 3, "e": "Wi-Fi only sync saves cellular data."}, {"q": "Which kinds of data can usually be synchronized?", "o": ["Only photos", "Mail, contacts, calendars, reminders and notes", "Only the SIM contents", "Only apps"], "a": 1, "e": "Users choose which data types sync."}, {"q": "Which additional authentication can MDM require for corporate apps?", "o": ["A bigger screen", "A longer cable", "Two-factor or multifactor authentication", "A second SIM"], "a": 2, "e": "MDM can require stronger authentication."}, {"q": "How can MDM control which applications are used?", "o": ["By allowing or forbidding apps and pushing required apps", "By disabling Wi-Fi permanently", "By changing the SIM", "By replacing the battery"], "a": 0, "e": "MDM decides allowed and forbidden apps."}, {"q": "What do BYOD policies need to define for lost or traded-in phones?", "o": ["What happens to the data", "The brand of cable", "The color of the phone", "The case style"], "a": 0, "e": "Policies cover data on lost or replaced devices."}, {"q": "What else is BYOD called?", "o": ["Buy your own data", "Bring your owned domain", "Bring your own technology", "Back up your own device"], "a": 2, "e": "BYOD is also bring your own technology."}, {"q": "Which information does an MDM console list for each device?", "o": ["The Wi-Fi password", "The SIM serial printed on the tray", "Battery chemistry and weight", "Device name, platform, username, email and IMEI"], "a": 3, "e": "The console summarizes device details."}, {"q": "Which setting can limit the size of apps that download over the mobile network?", "o": ["Airplane mode", "Cellular data and automatic download limits", "Screen timeout", "Stylus pairing"], "a": 1, "e": "Settings can limit cellular downloads."}, {"q": "What can differ between services such as Microsoft Exchange and Google when setting up business accounts?", "o": ["The phone’s weight", "The SIM size", "The screen resolution", "Which data types sync"], "a": 3, "e": "Sync options can differ per service."}, {"q": "Employees waste time configuring work email by hand. How can MDM help?", "o": ["Remove the battery", "Replace each SIM", "Push email settings to every phone", "Disable the keyboard"], "a": 2, "e": "MDM pushes configuration."}, {"q": "Cellular data bills are high because of background sync. What is a good fix?", "o": ["Limit sync to Wi-Fi only and restrict automatic downloads", "Increase the screen timeout", "Replace the speakers", "Disable the camera"], "a": 0, "e": "Wi-Fi only sync saves money."}, {"q": "A phone with corporate data is lost. What should have been in place?", "o": ["A louder ringtone", "A policy for what happens to data on lost devices", "A new case", "A larger SIM"], "a": 1, "e": "Policies cover lost and traded-in devices."}, {"q": "A failed phone is replaced. What allows restoring its data?", "o": ["A bigger battery", "The IMEI sticker", "Synchronization and backup settings", "The airplane mode switch"], "a": 2, "e": "Sync and backup restore data."}, {"q": "A secure area forbids photos. How can MDM help?", "o": ["Add a stylus", "Disable the camera through the Restrictions tab", "Use NFC", "Replace the SIM"], "a": 1, "e": "Restrictions can disable the camera."}, {"q": "An administrator needs to identify an exact device in the console. Which value is unique?", "o": ["Wi-Fi name", "Ringtone", "Device color", "IMEI"], "a": 3, "e": "IMEI uniquely identifies the device."}, {"q": "A company wants staff to use their own phones but keep company data safe. Which setup fits?", "o": ["BYOD with MDM partitioning", "COPE with no policies", "Tethering", "CYOD with no MDM"], "a": 0, "e": "BYOD with partitions separates work from personal data."}, {"q": "A company wants to give staff a limited list of approved phones to pick from. Which model fits?", "o": ["BYOD", "Tethering", "NFC", "CYOD"], "a": 3, "e": "CYOD lets users choose from approved devices."}]}]}, {"id": "l", "name": "Linux", "sub": "29 CMC commands · 6 mastered", "icon": "🐧", "topics": [{"id": "pwd", "name": "pwd", "tag": "MASTERED", "blocks": [{"h": "PURPOSE", "b": ["Prints the full path of the directory you’re currently standing in — logical (as navigated) or physical (real, symlink-resolved)."]}, {"h": "SYNTAX", "code": "pwd [-L | -P]"}, {"h": "FLAGS MASTERED", "b": ["<b>-L<\/b> — logical path — shows the path as you navigated it, symlinks included as-is (this is the default)", "<b>-P<\/b> — physical path — resolves any symlinks in the path and shows the real location on disk"]}, {"h": "EXAMPLE", "term": ["void@void:~$ ln -s /home/void/Real Shortcut", "void@void:~$ cd Shortcut", "void@void:~$ pwd -L", "/home/void/Shortcut", "void@void:~$ pwd -P", "/home/void/Real"]}, {"h": "NOTES", "r": [["WHY THE TWO EVER DIFFER", ["Without a symlink in the path, -L and -P give the exact same answer — the split only matters once ln -s is involved."]], ["DEFAULT BEHAVIOR", ["Plain pwd with no flag behaves like -L — most of the time that’s all you need; -P is specifically for confirming the real, resolved location."]]]}, {"h": "MENTAL MODEL", "b": ["GPS of Linux — always answers ’where am I right now,’ nothing else."]}], "probs": [], "qs": [{"q": "In pwd, what does -P show?", "o": ["The logical path as navigated", "The previous directory", "The home directory", "The physical path with symlinks resolved"], "a": 3, "e": "-P resolves symlinks to the real location."}, {"q": "Which pwd mode is the default?", "o": ["-L (logical)", "-P (physical)", "-H", "-R"], "a": 0, "e": "Plain pwd behaves like -L."}, {"q": "When do pwd -L and pwd -P differ?", "o": ["Always", "Only when a symlink is in the path", "Only in the home directory", "Only as root"], "a": 1, "e": "Without a symlink both give the same result."}]}, {"id": "ls", "name": "ls", "tag": "MASTERED", "blocks": [{"h": "PURPOSE", "b": ["Lists the files and directories inside your current location, with extensive control over sorting, detail, and display format."]}, {"h": "SYNTAX", "code": "ls [flags] [path]"}, {"h": "FLAGS MASTERED", "b": ["<b>-a<\/b> — show hidden files too (dotfiles)", "<b>-1<\/b> — one entry per line", "<b>-l<\/b> — long format — permissions, owner, group, size, modified date", "<b>-h<\/b> — human-readable sizes (K/M/G) — pairs with -l, does nothing alone", "<b>-S<\/b> — sort by size, largest first", "<b>-t<\/b> — sort by modification time, newest first", "<b>-u<\/b> — use last access time instead of modification time — with -l it displays it, with -t it sorts by it", "<b>-r<\/b> — reverse whatever sort order is currently active", "<b>-R<\/b> — recursive — lists subdirectories’ contents too", "<b>-d<\/b> — show a directory itself as one entry, not its contents", "<b>-F<\/b> — append a type indicator: / for directories, * for executables, @ for symlinks"]}, {"h": "EXAMPLE", "term": ["void@void:~$ ls -lhtr /var/log", "-rw-r--r-- 1 void void 1.2K Jul 30 09:10 old.log", "-rw-r--r-- 1 void void 3.4K Aug 1 22:41 recent.log", "-rw-r--r-- 1 void void 512 Aug 2 01:25 newest.log", "void@void:~$ ls -F", "Scripts/ deploy.sh* agent.sh@ notes.txt", "void@void:~$ ls -lu notes.txt", "-rw-r--r-- 1 void void 512 Aug 2 09:14 notes.txt"]}, {"h": "NOTES", "r": [["COMMON COMBINATIONS", ["-alh (hidden + long + readable), -lhS (largest first, readable), -ltr (oldest first, newest at the bottom — good for scrolling logs), -ld (info on the folder itself, not its contents), -lu (long format showing last access time instead of modified time)."]], ["-T VS -TR", ["-t alone puts the newest file at the top; adding -r flips it so the newest ends up at the bottom — genuinely useful when you want to scroll down to the most recent entry rather than scroll up."]], ["-F FOR FAST SCANNING", ["Real sysadmin habit — a quick ls -F tells you at a glance what’s safe to cd into versus cat, without needing the full -l detail."]], ["-LU VS -L", ["-l shows when a file was last modified; -lu swaps in when it was last accessed — they differ whenever a file was read but not edited."]]]}, {"h": "MENTAL MODEL", "b": ["Eyes of Linux — it’s how you actually see what’s around you."]}], "probs": [], "qs": [{"q": "Which ls flag shows hidden files?", "o": ["-h", "-a", "-r", "-d"], "a": 1, "e": "-a lists dotfiles."}, {"q": "Which flag makes ls -l sizes human-readable?", "o": ["-S", "-h", "-t", "-F"], "a": 1, "e": "-h gives K/M/G and needs -l."}, {"q": "What does ls -S do?", "o": ["Sorts by time, newest first", "Shows symlinks only", "Lists recursively", "Sorts by size, largest first"], "a": 3, "e": "-S sorts by size."}, {"q": "What does adding -r to ls -lt change?", "o": ["It hides old files", "It sorts by size", "The newest file ends at the bottom", "It lists subdirectories"], "a": 2, "e": "-r reverses the active sort."}, {"q": "Which ls flag lists subdirectory contents too?", "o": ["-R", "-d", "-1", "-u"], "a": 0, "e": "-R is recursive."}, {"q": "What does ls -F append to a symlink name?", "o": ["/", "@", "*", "#"], "a": 1, "e": "-F uses / dir, * executable, @ symlink."}, {"q": "What does ls -lu display?", "o": ["Owner only", "File type letters only", "Hidden files", "Last access time instead of modification time"], "a": 3, "e": "-u swaps in access time."}, {"q": "What does ls -d do on a directory?", "o": ["Shows the directory itself as one entry", "Deletes it", "Shows hidden files inside", "Sorts by date"], "a": 0, "e": "-d lists the folder, not its contents."}]}, {"id": "cd", "name": "cd", "tag": "MASTERED", "blocks": [{"h": "PURPOSE", "b": ["Moves you into a different directory. Doesn’t take traditional flags — mastery here is about the path forms, not switches."]}, {"h": "SYNTAX", "code": "cd [path]"}, {"h": "FLAGS MASTERED", "b": ["<b>cd folder<\/b> — enter that directory (relative)", "<b>cd ..<\/b> — move up to the parent directory", "<b>cd (no argument)<\/b> — go straight to your home directory", "<b>cd ~<\/b> — same as above — explicit home directory", "<b>cd /<\/b> — jump to the root of the filesystem", "<b>cd -<\/b> — jump back to the previous directory you were in", "<b>cd .<\/b> — stay in the current directory (mostly useful in scripts)"]}, {"h": "EXAMPLE", "term": ["void@void:~$ cd /var/log", "void@void:~$ cd /home/void/BF-SD-014", "void@void:~$ cd -", "/var/log", "void@void:~$ pwd", "/var/log"]}, {"h": "NOTES", "r": [["RELATIVE VS ABSOLUTE", ["A path starting with / is absolute, from the true root; anything else (a folder name, .., ~) is relative to where you currently stand."]], ["CD - IS A TOGGLE, NOT A STACK", ["It only remembers the one previous location — running cd - twice in a row just bounces you back and forth between two spots, it doesn’t walk further back through history."]]]}, {"h": "MENTAL MODEL", "b": ["Navigation / movement — cd never shows you anything, it only relocates you."]}], "probs": [], "qs": [{"q": "Which command jumps back to the previous directory?", "o": ["cd ..", "cd ~", "cd .", "cd -"], "a": 3, "e": "cd - returns to the last location."}, {"q": "What does cd with no argument do?", "o": ["Goes to the home directory", "Goes to root", "Stays in place", "Goes up one level"], "a": 0, "e": "Same as cd ~."}, {"q": "How does cd - behave when run twice in a row?", "o": ["It walks back through history", "It bounces between two locations", "It goes to root", "It errors"], "a": 1, "e": "cd - is a toggle, not a stack."}, {"q": "Which path is absolute?", "o": ["../log", "log", "/var/log", "./log"], "a": 2, "e": "Absolute paths start at /."}]}, {"id": "mkdir", "name": "mkdir", "tag": "MASTERED", "blocks": [{"h": "PURPOSE", "b": ["Creates new, empty directories — including full nested paths in one command when needed."]}, {"h": "SYNTAX", "code": "mkdir [flags] directory_name"}, {"h": "FLAGS MASTERED", "b": ["<b>-p<\/b> — parent — create any missing parent directories along the path instead of erroring", "<b>-m MODE<\/b> — set permissions on the new directory at creation time", "<b>-v<\/b> — verbose — print a confirmation line for every directory actually created"]}, {"h": "EXAMPLE", "term": ["void@void:~$ mkdir Project/src/core", "mkdir: cannot create directory 'Project/src/core': No such file or directory", "void@void:~$ mkdir -pv Project/src/core", "mkdir: created directory 'Project'", "mkdir: created directory 'Project/src'", "mkdir: created directory 'Project/src/core'"]}, {"h": "NOTES", "r": [["WITHOUT -P", ["mkdir refuses to create a nested path if the parent folders don’t already exist — it won’t guess that you want the whole chain built."]], ["-V IN SCRIPTS", ["Since mkdir is silent on success by default, -v is what actually lets you (or a script log) confirm each directory was really made, rather than just assuming."]]]}, {"h": "MENTAL MODEL", "b": ["Build structure, not just folders — especially with -p, you’re describing a whole path shape in one line."]}], "probs": [], "qs": [{"q": "Which mkdir flag creates missing parent directories?", "o": ["-v", "-m", "-r", "-p"], "a": 3, "e": "-p builds the whole path."}, {"q": "What happens with mkdir Project/src/core if Project does not exist?", "o": ["It fails: No such file or directory", "It creates all folders", "It creates only Project", "It asks to continue"], "a": 0, "e": "Without -p it will not guess."}, {"q": "What does mkdir -v print?", "o": ["Nothing", "Only errors", "The permissions", "A line for each directory created"], "a": 3, "e": "-v confirms each creation."}, {"q": "What does mkdir -m set?", "o": ["The owner", "The size", "Permissions on the new directory", "The parent path"], "a": 2, "e": "-m MODE sets permissions at creation."}]}, {"id": "touch", "name": "touch", "tag": "MASTERED", "blocks": [{"h": "PURPOSE", "b": ["Creates new empty files, or updates the timestamps of existing files without changing their content."]}, {"h": "SYNTAX", "code": "touch [flags] filename"}, {"h": "FLAGS MASTERED", "b": ["<b>-a<\/b> — update only the access time, leave the modification time untouched", "<b>-m<\/b> — update only the modification time, leave the access time untouched"]}, {"h": "EXAMPLE", "term": ["void@void:~$ touch notes.txt", "void@void:~$ touch -a notes.txt", "void@void:~$ touch -m notes.txt", "void@void:~$ ls -lu notes.txt"]}, {"h": "NOTES", "r": [["DEFAULT BEHAVIOR", ["Plain touch updates both access and modification time to right now; if the file doesn’t exist, it g
