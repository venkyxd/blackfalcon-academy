<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1b1b2f"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><title>BlackFalcon Question Bank</title>
<style>
:root{box-sizing:border-box;--bg:#f7f6fb;--card:#fff;--tx:#1b1b2f;--mu:#666;--ac:#8b1f4f;--ok:#1e7e34;--bad:#b3261e;--ln:#d9d7e3;--hd:#1b1b2f;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14131c;--card:#1f1e2b;--tx:#ecebf5;--mu:#a5a3b8;--ac:#e0709f;--ok:#5cc47a;--bad:#ff8a80;--ln:#38364a;--hd:#0c0b12}}
:root[data-theme="dark"]{--bg:#14131c;--card:#1f1e2b;--tx:#ecebf5;--mu:#a5a3b8;--ac:#e0709f;--ok:#5cc47a;--bad:#ff8a80;--ln:#38364a;--hd:#0c0b12}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{max-width:640px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:22px;margin:8px 0 2px}.m{color:var(--mu);margin:0 0 14px}
button{font:inherit;color:inherit;cursor:pointer}
.card{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:13px 14px;margin:0 0 10px}
.card b{display:block}.card span,.card small{display:block;color:var(--mu);font-size:14px}
.back{background:none;border:0;color:var(--ac);padding:6px 0;font-weight:600}
.seg{display:flex;gap:8px;margin:10px 0 14px}.seg button{flex:1;padding:9px;border:1px solid var(--ln);border-radius:10px;background:var(--card)}
.seg .on{background:var(--ac);color:#fff;border-color:var(--ac)}
.bar{height:6px;background:var(--ln);border-radius:3px;margin:8px 0 14px}.bar i{display:block;height:100%;background:var(--ac);border-radius:3px}
.q{font-weight:700;font-size:18px;margin:0 0 12px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--ln);border-radius:12px;padding:11px 12px;margin:0 0 9px}
.opt.sel{border-color:var(--ac)}.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--card))}
.ex{background:var(--card);border-left:4px solid var(--ac);padding:10px 12px;border-radius:8px;margin:6px 0 12px;font-size:15px}
.go{width:100%;padding:13px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-weight:700;margin-top:4px}.go:disabled{opacity:.4}
.sc{font-size:44px;font-weight:800;color:var(--ac);margin:6px 0}
.rv{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:11px 12px;margin:0 0 10px;font-size:15px}.rv b{display:block}
</style></head><body><div id="app"></div>
<script>
const D=[{"id": "a", "name": "CompTIA A+ 220-1201", "sub": "Core 1 · Section 1: Mobile Devices", "topics": [{"id": "1.1", "name": "1.1 Laptop Hardware", "qs": [{"q": "Which two battery technologies are commonly used in laptops?", "o": ["Lithium-ion and lithium-ion polymer", "Nickel-metal hydride and alkaline", "Alkaline and zinc-carbon", "Nickel-cadmium and lead-acid"], "a": 0, "e": "Laptops use Li-ion and Li-poly batteries."}, {"q": "Which statement about modern laptop batteries and the memory effect is correct?", "o": ["They must be fully discharged before every recharge", "Li-ion and Li-poly batteries have no memory effect, so they can be recharged at any time", "Li-poly batteries develop a memory effect but Li-ion do not", "The memory effect only affects built-in batteries"], "a": 1, "e": "No memory effect means partial charging does not reduce capacity."}, {"q": "What does SO-DIMM stand for?", "o": ["Small Optical Direct Interface Memory Module", "Serial Output Double In-line Memory Module", "Standard Output Dual Inline Memory Module", "Small Outline Dual In-line Memory Module"], "a": 3, "e": "SO-DIMM is the small memory module used in laptops."}, {"q": "Which memory form factor is used in most laptops?", "o": ["RIMM", "SIMM", "SO-DIMM", "Full-size DIMM"], "a": 2, "e": "Laptops use the smaller SO-DIMM instead of the desktop DIMM."}, {"q": "A technician opens a laptop memory panel and finds no slots because the RAM is soldered. What is required to upgrade the memory?", "o": ["Replace the CMOS battery", "Update the BIOS", "Replace the system board", "Install a SO-DIMM in the drive bay"], "a": 2, "e": "Soldered memory cannot be changed; the system board must be replaced."}, {"q": "Which drive size is typical for a laptop hard disk drive?", "o": ["5.25-inch", "3.5-inch", "8-inch", "2.5-inch"], "a": 3, "e": "Laptops use 2.5-inch drives; desktops use 3.5-inch."}, {"q": "Which storage form factor plugs directly into the system board and is held by a single screw?", "o": ["3.5-inch SATA drive", "M.2", "2.5-inch drive bay", "PCI expansion card"], "a": 1, "e": "M.2 drives are small and secured with one screw."}, {"q": "What is the main difference between an SSD and an HDD?", "o": ["An SSD has no moving parts", "An SSD uses spinning platters", "An SSD is always larger than an HDD", "An SSD cannot be used in a laptop"], "a": 0, "e": "An SSD is memory only, so it is faster and more reliable."}, {"q": "Older 2.5-inch laptop drives use which type of connections?", "o": ["Only a wireless connection", "A ribbon cable that also holds the screen", "One connection for data and one for power", "A single combined optical connector"], "a": 2, "e": "The 2.5-inch drive has separate data and power connections."}, {"q": "What is the fastest way to move the OS, apps and data from an old HDD to a new SSD?", "o": ["Use cloning or imaging software", "Reinstall every program by hand", "Defragment the HDD and swap the drives", "Copy only the documents folder"], "a": 0, "e": "Cloning makes an exact copy of the old drive on the new one."}, {"q": "Which laptop component is the most commonly replaced?", "o": ["Motherboard", "Keyboard", "Display panel", "Processor"], "a": 1, "e": "The keyboard is the most replaced laptop part."}, {"q": "How is a laptop keyboard usually connected to the system board?", "o": ["Molex connector", "SATA cable", "HDMI cable", "Ribbon cable"], "a": 3, "e": "A ribbon cable connects the keyboard to the board."}, {"q": "What is the purpose of the Fn key on a laptop?", "o": ["It locks the screen only", "It opens the BIOS setup directly", "It restarts the laptop", "It combines with other keys to give secondary functions"], "a": 3, "e": "Fn plus another key triggers a secondary function."}, {"q": "Which form factors do older, modular laptop wireless cards use?", "o": ["AGP or ISA", "PCIe x16 or VGA", "Mini PCI or Mini PCIe", "SO-DIMM or M.2"], "a": 2, "e": "Older laptops use Mini PCI or Mini PCIe wireless cards."}, {"q": "What are the two antenna connectors on an 802.11 laptop wireless card called?", "o": ["Left and right", "Main and auxiliary", "Send and receive", "Primary and tertiary"], "a": 1, "e": "Main and auxiliary, usually gray and black wires."}, {"q": "Where do laptop antenna wires usually run?", "o": ["Around the display", "Along the battery bay", "Through the hinge to the power jack", "Under the keyboard only"], "a": 0, "e": "They wrap around the display to sit high for better reception."}, {"q": "Which network type does Bluetooth form?", "o": ["LAN", "MAN", "WAN", "PAN"], "a": 3, "e": "Bluetooth is a Personal Area Network."}, {"q": "Which two Windows features use biometrics?", "o": ["Windows Hello Face and Windows Hello Fingerprint", "Windows Hello PIN and Windows Hello password", "BitLocker and Secure Boot", "Windows Defender and SmartScreen"], "a": 0, "e": "Face and Fingerprint are the biometric Hello options."}, {"q": "What does biometric login need to work on a laptop?", "o": ["A smart card only", "Only a strong password", "OS support plus hardware such as a fingerprint reader or camera", "An NFC chip only"], "a": 2, "e": "Both OS support and the matching hardware are required."}, {"q": "What is the typical range of NFC?", "o": ["About 100 meters", "About 4 centimeters or less", "About 30 meters", "About 10 meters"], "a": 1, "e": "NFC is a very short range technology."}, {"q": "Which is a common use of NFC?", "o": ["Connecting a laptop to a router 20 meters away", "Streaming video to a TV across a room", "Sharing a wired network connection", "Tap-to-pay at a point-of-sale terminal"], "a": 3, "e": "NFC is used for contactless payment and badge authentication."}, {"q": "Where are the camera and microphones usually located on a laptop?", "o": ["Camera top center, microphones on the left and right", "Camera on the left, microphones top center", "Camera at the bottom, microphones on the keyboard", "Camera on the lid back, microphones at the hinge"], "a": 0, "e": "Camera top center with mics on each side."}, {"q": "What does a modular laptop battery allow?", "o": ["Charging only while powered off", "Removal with a release button, then sliding a new one in", "Use of any battery from any model", "Replacement without any tools or alignment"], "a": 1, "e": "Modular batteries slide out with a release button."}, {"q": "Why must a replacement laptop battery match the make and model?", "o": ["Laptops will not boot with new batteries", "Any battery fits if the voltage label is similar", "Battery form factors differ between makes and models", "Only the color differs between models"], "a": 2, "e": "Form factors are model specific."}, {"q": "Which is a key benefit of upgrading an older laptop from an HDD to an SSD?", "o": ["Better speed and reliability", "Larger physical size", "Less storage than before always", "It adds a camera"], "a": 0, "e": "SSDs are faster and have no moving parts."}, {"q": "A laptop keyboard has stopped responding. How can the technician check whether the problem is hardware or OS?", "o": ["Replace the battery", "Flash the BIOS", "Replace the display", "Connect an external USB keyboard and test it"], "a": 3, "e": "An external keyboard separates internal hardware from OS faults."}, {"q": "An external USB keyboard works fine but the internal keyboard does not. What is the most likely problem?", "o": ["The wireless card", "The operating system", "The internal keyboard or its ribbon cable", "The USB controller"], "a": 2, "e": "The external one works, so the issue is internal."}, {"q": "A replacement battery does not fit the laptop. What is the most likely cause?", "o": ["The battery is too charged", "It is for a different make or model", "The battery needs a driver", "The laptop needs a BIOS update"], "a": 1, "e": "Battery form factors differ by model."}, {"q": "A user cannot remove the laptop battery. What does this mean?", "o": ["The battery is defective", "The laptop has no battery", "It is built in and a technician must open the laptop", "A release button is jammed"], "a": 2, "e": "Built-in batteries need the case opened."}, {"q": "A technician cannot find memory slots in a laptop that needs more RAM. What is the likely reason?", "o": ["The slots are on the display", "The memory is soldered to the system board", "RAM is stored on the SSD", "The memory is inside the keyboard"], "a": 1, "e": "Soldered memory is not upgradeable."}, {"q": "An older laptop with a spinning drive is slow. What is the most cost-effective upgrade?", "o": ["Replace the HDD with an SSD", "Add a second battery", "Replace the display", "Replace the keyboard"], "a": 0, "e": "An SSD is a big performance improvement for older laptops."}, {"q": "After a screen replacement, Wi-Fi and Bluetooth range is very weak. What should the technician check first?", "o": ["The battery latch", "The SO-DIMM seating", "The keyboard ribbon cable", "That the antenna wires are reconnected"], "a": 3, "e": "Antenna wires run around the display and must be reconnected."}, {"q": "A user wants fingerprint login but the option is missing. What should be checked?", "o": ["Whether a fingerprint reader exists and the OS supports it", "The antenna wires", "The size of the SSD", "The battery type"], "a": 0, "e": "Biometrics need hardware and OS support."}, {"q": "A technician replaces one keycap and the key will not click. What is the best approach in the future?", "o": ["Use thread lock on the key", "Replace the entire motherboard", "Press harder on the key", "Follow the manufacturer’s keycap steps; laptop keys are fragile"], "a": 3, "e": "Laptop keycaps are fragile."}, {"q": "A laptop has two SO-DIMM slots with one module installed. How is a second module added?", "o": ["Screw it into the system board", "Insert it into the M.2 slot", "Insert it into the empty slot and push until the clips lock", "Plug it into the USB port"], "a": 2, "e": "SO-DIMMs lock in with clips."}, {"q": "A user wants the old laptop’s programs and files on a new SSD with no reinstall. What should the technician use?", "o": ["A disk defragmenter", "Cloning software", "Windows Update", "A clean OS install"], "a": 1, "e": "Cloning creates an exact copy."}, {"q": "A user wants a higher quality image on video calls than the built-in camera gives. What is the best fix?", "o": ["Attach an external webcam", "Install more RAM", "Replace the keyboard", "Replace the battery"], "a": 0, "e": "An external webcam can be higher definition."}]}, {"id": "1.2(1)", "name": "1.2(1) Connecting Mobile Devices", "qs": [{"q": "How many pins does a USB-C connector have?", "o": ["9", "24", "15", "8"], "a": 1, "e": "USB-C has 24 pins."}, {"q": "How many pins does an Apple Lightning connector have?", "o": ["24", "15", "8", "4"], "a": 2, "e": "Lightning has 8 pins."}, {"q": "Which two connectors can be plugged in either orientation?", "o": ["Micro USB and mini USB", "Mini USB and USB Type-A", "USB Type-A and micro USB", "USB-C and Lightning"], "a": 3, "e": "Both USB-C and Lightning are reversible."}, {"q": "Which connector is Apple’s proprietary mobile connector used on older iPhones and iPads?", "o": ["Mini USB", "Lightning", "Micro USB", "USB-C"], "a": 1, "e": "Lightning is proprietary to Apple."}, {"q": "Which connector can carry data and also DisplayPort, HDMI or Thunderbolt video signals?", "o": ["USB-C", "Micro USB", "Lightning", "Mini USB"], "a": 0, "e": "USB-C can carry several signal types over one connector."}, {"q": "Older mobile devices commonly use which two USB plug types?", "o": ["USB-C and Lightning", "Type-A and Thunderbolt", "Mini USB and micro USB", "HDMI and DisplayPort"], "a": 2, "e": "Older devices use mini and micro USB."}, {"q": "Which USB connector type is commonly found at the computer end of a phone cable?", "o": ["Mini USB", "Lightning", "Micro USB", "USB Type-A"], "a": 3, "e": "The computer end is often Type-A."}, {"q": "What does NFC stand for?", "o": ["Near-Field Communication", "Near-Field Connection Cable", "Network Frequency Control", "Narrow File Channel"], "a": 0, "e": "NFC is Near-Field Communication."}, {"q": "Which is a common use of NFC on a phone?", "o": ["Charging the battery quickly", "Streaming video to a TV", "Making a payment at a point-of-sale terminal", "Sharing internet with ten devices"], "a": 2, "e": "NFC supports payments, door access and phone-to-phone transfer."}, {"q": "Which wireless technology forms a PAN and is used for headsets, keyboards and mice?", "o": ["NFC", "Bluetooth", "Cellular", "Wi-Fi Direct only"], "a": 1, "e": "Bluetooth is a Personal Area Network technology."}, {"q": "What is a mobile hotspot?", "o": ["A Bluetooth keyboard", "A cable that shares the screen", "A tool that charges the phone", "A phone acting as an internet router for many devices"], "a": 3, "e": "Hotspot lets many devices use the phone’s internet."}, {"q": "What is tethering?", "o": ["Sharing the phone’s internet with only one device", "Connecting only to Wi-Fi", "Sharing the phone’s internet with many devices", "Charging another phone from the battery"], "a": 0, "e": "Tethering connects a single device."}, {"q": "Besides charging, what else can a wired connection to a computer be used for?", "o": ["Cooling the processor", "Synchronization, backup, and identifying the device", "Increasing screen size", "Changing the SIM"], "a": 1, "e": "Wired connections carry data and identify the device."}, {"q": "What is the main advantage of USB-C over older USB connectors?", "o": ["It works only with Apple devices", "It has fewer pins than mini USB", "Higher speed and it can be inserted either way", "It is always wireless"], "a": 2, "e": "USB-C is faster and reversible."}, {"q": "What improvement did Lightning bring over older USB connectors?", "o": ["A larger 24-pin design", "Lower power output", "A single orientation only", "Higher power output and reversible insertion"], "a": 3, "e": "Lightning allows faster charging and either-way insertion."}, {"q": "Which technology lets a phone replace a separate ID badge to open a door?", "o": ["USB-C", "Tethering", "Hotspot", "NFC"], "a": 3, "e": "NFC supports access control with a phone."}, {"q": "A user cannot find the hotspot option on the phone. What should the technician check first?", "o": ["Whether the carrier plan allows hotspot or tethering", "The screen brightness", "The USB-C cable", "The Bluetooth headset"], "a": 0, "e": "Hotspot and tethering depend on the carrier."}, {"q": "A user carries a bag full of different charging cables. What is the best long-term fix?", "o": ["Disable charging", "Move to devices that use USB-C", "Use only mini USB", "Buy more Lightning cables"], "a": 1, "e": "One USB-C connector reduces the number of cable types."}, {"q": "An older Android phone uses a small flat micro plug. Which cable is needed?", "o": ["A USB-C cable", "A Lightning cable", "A micro USB cable", "An HDMI cable"], "a": 2, "e": "Match the plug to the device."}, {"q": "A user wants to back up a phone to a PC. What is a straightforward approach?", "o": ["Reset the phone", "Use NFC across the room", "Connect with a USB cable and use the sync or backup tool", "Use hotspot only"], "a": 2, "e": "Wired connections are used for sync and backup."}, {"q": "A smartwatch payment fails when held 20 cm from the terminal. What is the likely cause?", "o": ["NFC works only at very short range", "The watch needs a SIM card", "The cable is loose", "The terminal needs Bluetooth"], "a": 0, "e": "NFC range is about 4 cm or less."}, {"q": "A user wants a laptop to use only one phone’s internet connection. Which feature fits best?", "o": ["Airplane mode", "Tethering", "Hotspot with many devices", "NFC"], "a": 1, "e": "Tethering shares with a single device."}]}, {"id": "1.2(2)", "name": "1.2(2) Mobile Device Accessories", "qs": [{"q": "How does a stylus usually connect to a tablet?", "o": ["Lightning only", "Ethernet", "HDMI", "Bluetooth"], "a": 3, "e": "Styluses commonly use Bluetooth."}, {"q": "What should be checked before buying a stylus for a tablet?", "o": ["That it is compatible with the device", "The color of the stylus", "The length of the USB cable", "The battery size of the tablet"], "a": 0, "e": "A matched stylus gives the best connection and features."}, {"q": "What does TRRS stand for?", "o": ["Terminal-Ring-Receive-Sleeve", "Tip-Receive-Ring-Switch", "Transmit-Receive-Ring-Signal", "Tip-Ring-Ring-Sleeve"], "a": 3, "e": "TRRS is Tip-Ring-Ring-Sleeve."}, {"q": "Which wired headset connector is the common 3.5 mm analog jack?", "o": ["Thunderbolt", "TRRS", "USB-C only", "HDMI"], "a": 1, "e": "The 3.5 mm analog jack is a TRRS connector."}, {"q": "Which wired headset connection is used on older iPhones?", "o": ["DisplayPort", "TRRS 6.35 mm", "Lightning", "Micro USB"], "a": 2, "e": "Older iPhones use Lightning headsets."}, {"q": "How does a typical wireless headset connect?", "o": ["Bluetooth", "Ethernet", "Serial port", "IR only"], "a": 0, "e": "Wireless headsets use Bluetooth."}, {"q": "Which accessory can support full-size interface cards for a specific laptop?", "o": ["Port replicator", "Drawing pad", "Webcam", "Docking station"], "a": 3, "e": "Docks can take full-size adapter cards."}, {"q": "Which accessory is portable, usually connects by USB and works with almost any laptop or desktop but takes no adapter cards?", "o": ["Stylus", "Trackpad", "Port replicator", "Docking station"], "a": 2, "e": "A port replicator has no adapter card support."}, {"q": "Which ports are typical on a port replicator?", "o": ["Only Bluetooth", "USB, audio, video output and SD or microSD card readers", "Only a power cord", "Only PS/2"], "a": 1, "e": "Replicators add common ports."}, {"q": "How can many laptops stop accidental clicks from a built-in trackpad while typing?", "o": ["Change the SIM", "Close all apps", "Disable the trackpad with a function key", "Remove the battery"], "a": 2, "e": "A function key can turn the trackpad off."}, {"q": "How does an external trackpad for a desktop typically connect?", "o": ["HDMI", "Bluetooth", "SATA", "VGA"], "a": 1, "e": "External trackpads are battery powered and use Bluetooth."}, {"q": "What is a drawing pad?", "o": ["A wireless speaker", "A kind of docking station", "A built-in laptop camera", "An external digitizer with its own stylus for precise input"], "a": 3, "e": "It is used for artistic input."}, {"q": "How does an external webcam commonly connect to a computer?", "o": ["USB", "HDMI", "SATA", "TRRS"], "a": 0, "e": "External webcams usually use USB."}, {"q": "Which accessory gives better sound than a phone’s small speaker and is battery powered?", "o": ["A stylus", "A port replicator", "A wireless Bluetooth speaker", "A drawing pad"], "a": 2, "e": "Wireless speakers are portable and use Bluetooth."}, {"q": "What does a docking station let a user do?", "o": ["Increase battery size", "Charge a phone wirelessly", "Replace the SSD", "Connect or disconnect a laptop from desk devices quickly"], "a": 3, "e": "Docks avoid plugging and unplugging each cable."}, {"q": "Which feature makes multi-finger gestures easy on a laptop?", "o": ["Drawing pad only", "Trackpad", "Port replicator", "TRRS jack"], "a": 1, "e": "Trackpads support multi-finger gestures."}, {"q": "A stylus will not work with a tablet. What should the technician check first?", "o": ["Whether the stylus is compatible and paired over Bluetooth", "The SIM card", "The SO-DIMM seating", "The port replicator"], "a": 0, "e": "Compatibility and pairing come first."}, {"q": "A wireless headset battery dies in the middle of the day. What is the simplest fix?", "o": ["Switch to a wired headset", "Replace the SSD", "Use a stylus", "Reinstall the OS"], "a": 0, "e": "A wired headset needs no battery."}, {"q": "A laptop cursor jumps while typing. What is the easiest fix?", "o": ["Replace the memory", "Install a port replicator", "Disable the trackpad with the function key", "Change the SIM"], "a": 2, "e": "Accidental palm touches cause cursor jumps."}, {"q": "A user unplugs five cables from a laptop every evening. What is the best solution?", "o": ["Buy a drawing pad", "Use a stylus", "Replace the battery", "Use a docking station"], "a": 3, "e": "A dock reconnects everything at once."}, {"q": "A desktop has no camera but the user needs video conferencing. What is the solution?", "o": ["Add a Lightning cable", "Add an external USB webcam", "Add a docking station", "Add a stylus"], "a": 1, "e": "External webcams add a camera."}, {"q": "A traveler needs an SD card reader and extra USB ports but no adapter cards. What fits best?", "o": ["Stylus", "Port replicator", "Drawing pad", "Trackpad"], "a": 1, "e": "Port replicators are portable and add common ports."}, {"q": "A phone speaker sounds thin. What is the best low-cost improvement?", "o": ["Use a Bluetooth wireless speaker", "Disable the trackpad", "Replace the SIM", "Use a stylus"], "a": 0, "e": "A wireless speaker provides better fidelity."}]}, {"id": "1.3(1)", "name": "1.3(1) Mobile Device Networks", "qs": [{"q": "What does LTE stand for?", "o": ["Low-Tier Ethernet", "Local Transmission Extension", "Long-Term Encryption", "Long-Term Evolution"], "a": 3, "e": "LTE is Long-Term Evolution."}, {"q": "What is the bandwidth of 4G LTE?", "o": ["Up to 1 Mbps", "Up to 10 Gbps", "Up to 150 Mbps", "Up to 300 Mbps"], "a": 2, "e": "LTE offers up to 150 Mbps."}, {"q": "What is the throughput of LTE-A?", "o": ["Up to 150 Mbps", "Up to 54 Mbps", "Up to 10 Gbps", "Up to 300 Mbps"], "a": 3, "e": "LTE Advanced reaches up to 300 Mbps."}, {"q": "What is the top speed of 5G on higher frequencies?", "o": ["Up to 100 Mbps", "Up to 150 Mbps", "Up to 10 Gbps", "Up to 300 Mbps"], "a": 2, "e": "5G can reach 10 Gbps on higher frequencies."}, {"q": "What speed range does 5G offer on other frequencies?", "o": ["About 20 to 40 Mbps", "About 100 to 900 Mbps", "About 50 to 100 Gbps", "About 1 to 5 Mbps"], "a": 1, "e": "Other 5G frequencies give 100 to 900 Mbps."}, {"q": "Which 5G benefit helps IoT devices and faster notifications?", "o": ["Large bandwidth for each device", "Shorter SIM cards", "Wired connections", "Lower power for the screen"], "a": 0, "e": "5G supports many devices with high bandwidth."}, {"q": "What does GSM stand for?", "o": ["Global System for Mobile Communications", "General Signal Mobile", "Global Satellite Messaging", "Grid System for Mobile Radio"], "a": 0, "e": "4G LTE is based on GSM."}, {"q": "What does SIM stand for?", "o": ["Secure Internet Module", "Subscriber Internet Mobile", "Subscriber Identity Module", "Signal Input Memory"], "a": 2, "e": "A SIM identifies the phone on the carrier network."}, {"q": "What information can a SIM hold?", "o": ["Only photos", "The BIOS", "The operating system", "Carrier and subscriber information, a phone number and contacts or messages"], "a": 3, "e": "SIMs hold subscriber and network information."}, {"q": "What happens to the phone number if the SIM is moved to another phone?", "o": ["The number is deleted", "The number moves with the SIM", "The number becomes an eSIM", "The number stays on the old phone"], "a": 1, "e": "The SIM carries the number."}, {"q": "What is an eSIM?", "o": ["An embedded SIM that is a physical part of the phone and is transferred with software", "A removable card with a tiny screw", "A type of microSD card", "A second battery"], "a": 0, "e": "eSIMs are moved with software or a QR code."}, {"q": "How can a user transfer an eSIM to another phone?", "o": ["Replace the motherboard", "Use phone software, an existing phone, or a QR code", "Use an HDMI cable", "Remove the card with a tool"], "a": 1, "e": "eSIM transfer is done with software."}, {"q": "What is the benefit of a phone that supports multiple SIMs?", "o": ["Longer battery life", "More storage", "Faster screen refresh", "Multiple numbers or profiles on one phone"], "a": 3, "e": "Dual SIM allows several profiles."}, {"q": "What does airplane mode do?", "o": ["Locks the screen only", "Turns off the camera", "Disables all communication on the device", "Closes all apps"], "a": 2, "e": "You can then enable individual features."}, {"q": "Which feature lets a phone make calls over a Wi-Fi network when cellular signal is weak?", "o": ["Bluetooth pairing", "Wi-Fi calling", "NFC", "Tethering"], "a": 1, "e": "Wi-Fi calling uses 802.11 for voice."}, {"q": "What does a mobile hotspot do?", "o": ["Disables Bluetooth", "Increases cellular tower power", "Shares the phone’s cellular connection with other devices over 802.11", "Moves the SIM to another phone"], "a": 2, "e": "A hotspot shares the phone’s cellular data."}, {"q": "Which is the correct order for pairing Bluetooth devices?", "o": ["Enable Bluetooth, make discoverable, select the device, confirm the PIN, test the connection", "Make discoverable, test, enable Bluetooth, select the device, confirm the PIN", "Confirm the PIN, enable Bluetooth, select the device, make discoverable, test", "Select the device, test, enable Bluetooth, confirm the PIN, make discoverable"], "a": 0, "e": "Enable, discoverable, select, PIN, test."}, {"q": "How often must two Bluetooth devices be paired?", "o": ["Once a day", "Only after a factory reset", "Every time they connect", "Once, then they can connect and disconnect freely"], "a": 3, "e": "Pairing is done once per device."}, {"q": "What does PIN stand for?", "o": ["Protected Input Network", "Personal Identification Number", "Private Internet Node", "Paired Interface Number"], "a": 1, "e": "A PIN may be fixed or change each time."}, {"q": "How many satellites must GPS see for accurate readings?", "o": ["Four", "Two", "One", "Eight"], "a": 0, "e": "GPS needs four satellites."}, {"q": "Which three values does GPS provide?", "o": ["SSID, IP and MAC", "Speed, battery and heading", "Temperature, speed and pressure", "Longitude, latitude and altitude"], "a": 3, "e": "GPS gives location and altitude."}, {"q": "Which organization created GPS?", "o": ["NASA only", "European Space Agency", "United States Department of Defense", "Federal Communications Commission"], "a": 2, "e": "GPS was created by the US DoD."}, {"q": "Which other methods can a phone use to find its location besides GPS?", "o": ["HDMI signals", "Bluetooth keyboards and USB hubs", "NFC tags only", "Nearby Wi-Fi networks and cell tower triangulation"], "a": 3, "e": "Wi-Fi and cell towers provide alternate location data."}, {"q": "How is a cellular network structured?", "o": ["Land divided into cells, each covered by antennas", "Wired switches in each phone", "One huge antenna covering a country", "A single Wi-Fi access point"], "a": 0, "e": "Cellular networks are made of cells."}, {"q": "Which generation of cellular technology is commonly called LTE?", "o": ["5G", "2G", "4G", "3G"], "a": 2, "e": "4G is commonly called LTE."}, {"q": "A user has poor cellular signal inside a building but wants to make calls. What is the best option?", "o": ["Use NFC", "Use Wi-Fi calling", "Use airplane mode", "Use tethering"], "a": 1, "e": "Wi-Fi calling carries voice over 802.11."}, {"q": "A phone’s hotspot option is unavailable. What should be checked first?", "o": ["The SIM tray color", "The stylus battery", "Whether the carrier allows hotspot and any extra charge applies", "The headset jack"], "a": 2, "e": "Carriers may block or charge for hotspot."}, {"q": "A Bluetooth speaker does not appear in the phone’s device list. What is the most likely issue?", "o": ["The speaker is not in discoverable mode", "The SIM card is full", "GPS is off", "The phone is on 5G"], "a": 0, "e": "Both devices must be discoverable."}, {"q": "A paired Bluetooth device does not reconnect after a power cycle. What should the technician do?", "o": ["Disable GPS", "Repeat the pairing process", "Replace the SIM", "Turn on airplane mode permanently"], "a": 1, "e": "If it fails to reconnect, pair again."}, {"q": "A phone cannot get a GPS lock indoors. What is the likely cause?", "o": ["The SIM is the wrong size", "Bluetooth is on", "The battery is Li-ion", "Fewer than four satellites are in view"], "a": 3, "e": "GPS needs four satellites; Wi-Fi or cell data can help."}, {"q": "A user buys a new phone and wants to keep the same number with a physical SIM. What should be done?", "o": ["Reset the old phone", "Move the SIM to the new phone", "Use a hotspot", "Pair it by Bluetooth"], "a": 1, "e": "The SIM carries the number."}, {"q": "A user’s new phone uses an eSIM. How can the number be moved?", "o": ["Replace the battery", "Connect a USB-C cable only", "Insert a tool into the tray", "Transfer it with software or a QR code"], "a": 3, "e": "eSIMs are transferred through software."}, {"q": "Technicians need the PIN for a Bluetooth device and do not know it. Where should they look?", "o": ["The SIM card", "The display brightness setting", "The device documentation", "The GPS menu"], "a": 2, "e": "Documentation lists the PIN and discoverable steps."}]}, {"id": "1.3(2)", "name": "1.3(2) Mobile Device Management", "qs": [{"q": "What does MDM stand for?", "o": ["Mobile Device Management", "Mobile Data Module", "Managed Device Memory", "Multi-Device Messaging"], "a": 0, "e": "MDM centrally manages mobile devices."}, {"q": "What does BYOD stand for?", "o": ["Bring Your Own Device", "Back Up Your Own Data", "Build Your Own Domain", "Bring Your Offline Disk"], "a": 0, "e": "The employee owns the phone."}, {"q": "What does COPE stand for?", "o": ["Company Owned, Partly Encrypted", "Corporate Owned, Personally Enabled", "Corporate Only, Personal Exempt", "Controlled Open Personal Equipment"], "a": 1, "e": "The company owns and manages the device."}, {"q": "What does CYOD stand for?", "o": ["Control Your Owned Domain", "Connect Your Open Device", "Choose Your Own Device", "Change Your Online Data"], "a": 2, "e": "Users pick from a company-approved list."}, {"q": "Which model has the company buy, assign and fully control the device while allowing personal use?", "o": ["BYOD", "MDM only", "CYOD", "COPE"], "a": 3, "e": "COPE gives the company full control."}, {"q": "Which model has the employee own the phone and use it for work?", "o": ["BYOD", "CYOD", "COPE", "ROAM"], "a": 0, "e": "BYOD uses the employee’s own device."}, {"q": "Which model lets the user choose from a set of approved devices?", "o": ["BYOD", "COPE", "CYOD", "MDM"], "a": 2, "e": "CYOD offers a company-approved choice."}, {"q": "Which technology can separate personal data from corporate data on one phone?", "o": ["Airplane mode", "MDM partitioning", "NFC", "Tethering"], "a": 1, "e": "MDM can partition work and home data."}, {"q": "What can MDM push to a user’s phone?", "o": ["A new screen", "A new battery", "A new SIM", "Email settings and apps"], "a": 3, "e": "MDM pushes settings and apps."}, {"q": "Which security policy can MDM enforce on a phone?", "o": ["Disabling the case", "Removing the antenna", "Requiring a screen lock with a PIN", "Changing the SIM size"], "a": 2, "e": "Screen locks are a typical MDM policy."}, {"q": "What is the IMEI?", "o": ["The phone’s Wi-Fi name", "A unique device identifier shown in the MDM console", "The speed of the LTE signal", "A password for email"], "a": 1, "e": "IMEI is International Mobile Equipment Identity."}, {"q": "What can the MDM Restrictions tab control?", "o": ["Features such as the camera, FaceTime, voice dialing and Siri", "The battery chemistry", "The screen size", "The SIM tray"], "a": 0, "e": "Restrictions enable or disable features."}, {"q": "What does synchronization over the air mean?", "o": ["Data syncs only on desktops", "Data syncs by NFC taps", "Data syncs only by USB cable", "Data syncs wirelessly because phones are rarely plugged in centrally"], "a": 3, "e": "OTA sync fits mobile use."}, {"q": "Why might an organization allow sync only over Wi-Fi?", "o": ["To speed up the camera", "To remove the SIM", "To increase screen brightness", "To avoid cellular data costs"], "a": 3, "e": "Wi-Fi only sync saves cellular data."}, {"q": "Which kinds of data can usually be synchronized?", "o": ["Only photos", "Mail, contacts, calendars, reminders and notes", "Only the SIM contents", "Only apps"], "a": 1, "e": "Users choose which data types sync."}, {"q": "Which additional authentication can MDM require for corporate apps?", "o": ["A bigger screen", "A longer cable", "Two-factor or multifactor authentication", "A second SIM"], "a": 2, "e": "MDM can require stronger authentication."}, {"q": "How can MDM control which applications are used?", "o": ["By allowing or forbidding apps and pushing required apps", "By disabling Wi-Fi permanently", "By changing the SIM", "By replacing the battery"], "a": 0, "e": "MDM decides allowed and forbidden apps."}, {"q": "What do BYOD policies need to define for lost or traded-in phones?", "o": ["What happens to the data", "The brand of cable", "The color of the phone", "The case style"], "a": 0, "e": "Policies cover data on lost or replaced devices."}, {"q": "What else is BYOD called?", "o": ["Buy your own data", "Bring your owned domain", "Bring your own technology", "Back up your own device"], "a": 2, "e": "BYOD is also bring your own technology."}, {"q": "Which information does an MDM console list for each device?", "o": ["The Wi-Fi password", "The SIM serial printed on the tray", "Battery chemistry and weight", "Device name, platform, username, email and IMEI"], "a": 3, "e": "The console summarizes device details."}, {"q": "Which setting can limit the size of apps that download over the mobile network?", "o": ["Airplane mode", "Cellular data and automatic download limits", "Screen timeout", "Stylus pairing"], "a": 1, "e": "Settings can limit cellular downloads."}, {"q": "What can differ between services such as Microsoft Exchange and Google when setting up business accounts?", "o": ["The phone’s weight", "The SIM size", "The screen resolution", "Which data types sync"], "a": 3, "e": "Sync options can differ per service."}, {"q": "Employees waste time configuring work email by hand. How can MDM help?", "o": ["Remove the battery", "Replace each SIM", "Push email settings to every phone", "Disable the keyboard"], "a": 2, "e": "MDM pushes configuration."}, {"q": "Cellular data bills are high because of background sync. What is a good fix?", "o": ["Limit sync to Wi-Fi only and restrict automatic downloads", "Increase the screen timeout", "Replace the speakers", "Disable the camera"], "a": 0, "e": "Wi-Fi only sync saves money."}, {"q": "A phone with corporate data is lost. What should have been in place?", "o": ["A louder ringtone", "A policy for what happens to data on lost devices", "A new case", "A larger SIM"], "a": 1, "e": "Policies cover lost and traded-in devices."}, {"q": "A failed phone is replaced. What allows restoring its data?", "o": ["A bigger battery", "The IMEI sticker", "Synchronization and backup settings", "The airplane mode switch"], "a": 2, "e": "Sync and backup restore data."}, {"q": "A secure area forbids photos. How can MDM help?", "o": ["Add a stylus", "Disable the camera through the Restrictions tab", "Use NFC", "Replace the SIM"], "a": 1, "e": "Restrictions can disable the camera."}, {"q": "An administrator needs to identify an exact device in the console. Which value is unique?", "o": ["Wi-Fi name", "Ringtone", "Device color", "IMEI"], "a": 3, "e": "IMEI uniquely identifies the device."}, {"q": "A company wants staff to use their own phones but keep company data safe. Which setup fits?", "o": ["BYOD with MDM partitioning", "COPE with no policies", "Tethering", "CYOD with no MDM"], "a": 0, "e": "BYOD with partitions separates work from personal data."}, {"q": "A company wants to give staff a limited list of approved phones to pick from. Which model fits?", "o": ["BYOD", "Tethering", "NFC", "CYOD"], "a": 3, "e": "CYOD lets users choose from approved devices."}]}]}, {"id": "l", "name": "Linux (BlackFalcon CMC)", "sub": "Mastered commands: pwd, ls, cd, mkdir, touch, mv", "topics": [{"id": "pwd", "name": "pwd", "qs": [{"q": "In pwd, what does -P show?", "o": ["The logical path as navigated", "The previous directory", "The home directory", "The physical path with symlinks resolved"], "a": 3, "e": "-P resolves symlinks to the real location."}, {"q": "Which pwd mode is the default?", "o": ["-L (logical)", "-P (physical)", "-H", "-R"], "a": 0, "e": "Plain pwd behaves like -L."}, {"q": "When do pwd -L and pwd -P differ?", "o": ["Always", "Only when a symlink is in the path", "Only in the home directory", "Only as root"], "a": 1, "e": "Without a symlink both give the same result."}]}, {"id": "ls", "name": "ls", "qs": [{"q": "Which ls flag shows hidden files?", "o": ["-h", "-a", "-r", "-d"], "a": 1, "e": "-a lists dotfiles."}, {"q": "Which flag makes ls -l sizes human-readable?", "o": ["-S", "-h", "-t", "-F"], "a": 1, "e": "-h gives K/M/G and needs -l."}, {"q": "What does ls -S do?", "o": ["Sorts by time, newest first", "Shows symlinks only", "Lists recursively", "Sorts by size, largest first"], "a": 3, "e": "-S sorts by size."}, {"q": "What does adding -r to ls -lt change?", "o": ["It hides old files", "It sorts by size", "The newest file ends at the bottom", "It lists subdirectories"], "a": 2, "e": "-r reverses the active sort."}, {"q": "Which ls flag lists subdirectory contents too?", "o": ["-R", "-d", "-1", "-u"], "a": 0, "e": "-R is recursive."}, {"q": "What does ls -F append to a symlink name?", "o": ["/", "@", "*", "#"], "a": 1, "e": "-F uses / dir, * executable, @ symlink."}, {"q": "What does ls -lu display?", "o": ["Owner only", "File type letters only", "Hidden files", "Last access time instead of modification time"], "a": 3, "e": "-u swaps in access time."}, {"q": "What does ls -d do on a directory?", "o": ["Shows the directory itself as one entry", "Deletes it", "Shows hidden files inside", "Sorts by date"], "a": 0, "e": "-d lists the folder, not its contents."}]}, {"id": "cd", "name": "cd", "qs": [{"q": "Which command jumps back to the previous directory?", "o": ["cd ..", "cd ~", "cd .", "cd -"], "a": 3, "e": "cd - returns to the last location."}, {"q": "What does cd with no argument do?", "o": ["Goes to the home directory", "Goes to root", "Stays in place", "Goes up one level"], "a": 0, "e": "Same as cd ~."}, {"q": "How does cd - behave when run twice in a row?", "o": ["It walks back through history", "It bounces between two locations", "It goes to root", "It errors"], "a": 1, "e": "cd - is a toggle, not a stack."}, {"q": "Which path is absolute?", "o": ["../log", "log", "/var/log", "./log"], "a": 2, "e": "Absolute paths start at /."}]}, {"id": "mkdir", "name": "mkdir", "qs": [{"q": "Which mkdir flag creates missing parent directories?", "o": ["-v", "-m", "-r", "-p"], "a": 3, "e": "-p builds the whole path."}, {"q": "What happens with mkdir Project/src/core if Project does not exist?", "o": ["It fails: No such file or directory", "It creates all folders", "It creates only Project", "It asks to continue"], "a": 0, "e": "Without -p it will not guess."}, {"q": "What does mkdir -v print?", "o": ["Nothing", "Only errors", "The permissions", "A line for each directory created"], "a": 3, "e": "-v confirms each creation."}, {"q": "What does mkdir -m set?", "o": ["The owner", "The size", "Permissions on the new directory", "The parent path"], "a": 2, "e": "-m MODE sets permissions at creation."}]}, {"id": "touch", "name": "touch", "qs": [{"q": "What does touch do to a file that does not exist?", "o": ["Errors out", "Opens an editor", "Creates a directory", "Creates it empty"], "a": 3, "e": "touch creates empty files."}, {"q": "What does touch -a change?", "o": ["Only the access time", "Only the modification time", "Both times", "The file content"], "a": 0, "e": "-a updates access time only."}, {"q": "What does plain touch update on an existing file?", "o": ["Both access and modification times", "Only the content", "Only permissions", "Only the name"], "a": 0, "e": "Both times become now."}]}, {"id": "mv", "name": "mv", "qs": [{"q": "Which mv flag asks before overwriting?", "o": ["-f", "-i", "-n", "-v"], "a": 1, "e": "-i is interactive."}, {"q": "Which mv flag never overwrites an existing destination?", "o": ["-f", "-n", "-i", "-v"], "a": 1, "e": "-n is no-clobber."}, {"q": "What does mv -v print?", "o": ["Only errors", "The file size", "Nothing", "What was moved or renamed"], "a": 3, "e": "-v is verbose."}, {"q": "How do you rename a file in Linux?", "o": ["rn old new", "touch new", "mv with a new name in the same directory", "cd new"], "a": 2, "e": "Rename is a move to a new name."}]}]}];let P={};try{P=JSON.parse(localStorage.getItem("bfqb")||"{}")}catch(e){}
const sv=()=>{try{localStorage.setItem("bfqb",JSON.stringify(P))}catch(e){}};
const $=document.getElementById("app"),L="ABCD";let S={mode:"go"};
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function home(){$.innerHTML=`<h1>BlackFalcon Question Bank</h1><p class=m>Pick a subject</p>`+D.map((s,i)=>`<button class=card onclick="subj(${i})"><b>${esc(s.name)}</b><span>${esc(s.sub)}</span><small>${s.topics.reduce((n,t)=>n+t.qs.length,0)} questions</small></button>`).join("")}
function subj(i){const s=D[i];$.innerHTML=`<button class=back onclick="home()">\u2039 Back</button><h1>${esc(s.name)}</h1><div class=seg><button id=m1 class="${S.mode=="go"?"on":""}" onclick="mode('go')">Check as I go</button><button id=m2 class="${S.mode=="exam"?"on":""}" onclick="mode('exam')">Exam mode</button></div><button class=card onclick="start(${i},-1)"><b>Mixed quiz</b><span>20 random questions</span></button>`+s.topics.map((t,j)=>{const b=P[s.id+t.id];return`<button class=card onclick="start(${i},${j})"><b>${esc(t.name)}</b><small>${t.qs.length} questions \u00b7 best ${b==null?"\u2013":b+"%"}</small></button>`}).join("");S.si=i}
function mode(m){S.mode=m;subj(S.si)}
function start(i,j){const s=D[i];let l;if(j<0){l=s.topics.flatMap(t=>t.qs).map(x=>x);for(let k=l.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[l[k],l[r]]=[l[r],l[k]]}l=l.slice(0,20)}else l=s.topics[j].qs;S={...S,si:i,j,l,n:0,a:[]};ask()}
function ask(){const q=S.l[S.n],a=S.a[S.n],go=S.mode=="go",done=a!=null&&go;
$.innerHTML=`<button class=back onclick="subj(${S.si})">\u2039 Quit</button><div class=bar><i style="width:${S.n/S.l.length*100}%"></i></div><p class=m>Question ${S.n+1} of ${S.l.length}</p><p class=q>${esc(q.q)}</p>`+q.o.map((o,k)=>{let c="opt";if(done)c+=k==q.a?" ok":k==a?" no":"";else if(a==k)c+=" sel";return`<button class="${c}" onclick="pick(${k})"><b>${L[k]}.</b> ${esc(o)}</button>`}).join("")+(done?`<div class=ex>${a==q.a?"Correct. ":"Not quite. "}${esc(q.e)}</div>`:"")+`<button class=go ${a==null?"disabled":""} onclick="nx()">${S.n+1==S.l.length?"Finish":"Next"}</button>`}
function pick(k){if(S.mode=="go"&&S.a[S.n]!=null)return;S.a[S.n]=k;ask()}
function nx(){S.n++;S.n>=S.l.length?res():ask()}
function res(){const t=S.l.length,c=S.l.filter((q,i)=>S.a[i]==q.a).length,p=Math.round(c/t*100);if(S.j>=0){const k=D[S.si].id+D[S.si].topics[S.j].id;if(P[k]==null||p>P[k]){P[k]=p;sv()}}
const miss=S.l.map((q,i)=>[q,i]).filter(([q,i])=>S.a[i]!=q.a);
$.innerHTML=`<h1>Result</h1><div class=sc>${c} / ${t}</div><p class=m>${p}%</p>`+(miss.length?`<h1 style="font-size:18px">Review missed</h1>`+miss.map(([q,i])=>`<div class=rv><b>${esc(q.q)}</b>Your answer: ${S.a[i]==null?"none":L[S.a[i]]+". "+esc(q.o[S.a[i]])}<br>Correct: <b style="display:inline;color:var(--ok)">${L[q.a]}. ${esc(q.o[q.a])}</b><br>${esc(q.e)}</div>`).join(""):`<p>Perfect score.</p>`)+`<button class=go onclick="start(${S.si},${S.j})">Try again</button><button class=back onclick="subj(${S.si})">\u2039 Back to topics</button>`}
home();
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){})}
