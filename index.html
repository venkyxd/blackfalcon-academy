ets created empty."]], ["PAIRS WITH LS", ["ls -l shows the modification time and ls -lu shows the access time — touch -a and touch -m are how you see each one change on its own."]]]}, {"h": "MENTAL MODEL", "b": ["A clock stamp — touch doesn’t write content, it just marks ’something happened here, right now.’"]}], "probs": [], "qs": [{"q": "What does touch do to a file that does not exist?", "o": ["Errors out", "Opens an editor", "Creates a directory", "Creates it empty"], "a": 3, "e": "touch creates empty files."}, {"q": "What does touch -a change?", "o": ["Only the access time", "Only the modification time", "Both times", "The file content"], "a": 0, "e": "-a updates access time only."}, {"q": "What does plain touch update on an existing file?", "o": ["Both access and modification times", "Only the content", "Only permissions", "Only the name"], "a": 0, "e": "Both times become now."}]}, {"id": "mv", "name": "mv", "tag": "MASTERED", "blocks": [{"h": "PURPOSE", "b": ["Moves files or directories to a new location, or renames them — a rename is just a move within the same directory under a new name."]}, {"h": "SYNTAX", "code": "mv [flags] source destination"}, {"h": "FLAGS MASTERED", "b": ["<b>-i<\/b> — interactive — ask before overwriting an existing destination", "<b>-f<\/b> — force — overwrite without asking, even if the destination exists", "<b>-n<\/b> — no-clobber — never overwrite an existing destination, skip it instead", "<b>-v<\/b> — verbose — print a line showing exactly what was moved or renamed"]}, {"h": "EXAMPLE", "term": ["void@void:~$ mv -v notes.txt Archive/", "renamed 'notes.txt' -> 'Archive/notes.txt'", "void@void:~$ mv -i report.txt old_report.txt", "mv: overwrite 'old_report.txt'? y"]}, {"h": "NOTES", "r": [["-I VS -F VS -N", ["All three handle the same situation — the destination already exists — in three ways: ask, force, or skip. If more than one is given, the last one wins."]], ["RENAME VS MOVE", ["mv old.txt new.txt in the same folder is a rename; mv file.txt Folder/ is a move — same command, no separate rename tool."]]]}, {"h": "MENTAL MODEL", "b": ["Relocation, not duplication — unlike cp, the original stops existing at its old location."]}], "probs": [], "qs": [{"q": "Which mv flag asks before overwriting?", "o": ["-f", "-i", "-n", "-v"], "a": 1, "e": "-i is interactive."}, {"q": "Which mv flag never overwrites an existing destination?", "o": ["-f", "-n", "-i", "-v"], "a": 1, "e": "-n is no-clobber."}, {"q": "What does mv -v print?", "o": ["Only errors", "The file size", "Nothing", "What was moved or renamed"], "a": 3, "e": "-v is verbose."}, {"q": "How do you rename a file in Linux?", "o": ["rn old new", "touch new", "mv with a new name in the same directory", "cd new"], "a": 2, "e": "Rename is a move to a new name."}]}, {"id": "cp", "name": "cp", "tag": "Basics (pending mastery)", "blocks": [{"h": "PURPOSE", "b": ["Copies files or directories to a new location."]}, {"h": "SYNTAX", "code": "cp [flags] source destination"}, {"h": "CORE USAGE", "b": ["<b>cp file copy<\/b> — copy a file under a new name", "<b>-r<\/b> — recursive — required to copy a directory and its contents"]}, {"h": "EXAMPLE", "term": ["void@void:~$ cp notes.txt backup.txt", "void@void:~$ cp -r Project Project_copy"]}, {"h": "MENTAL MODEL", "b": ["A photocopier — the original stays, you get a second one."]}], "probs": [], "qs": []}, {"id": "rm", "name": "rm", "tag": "Basics (pending mastery)", "blocks": [{"h": "PURPOSE", "b": ["Removes files and directories permanently."]}, {"h": "SYNTAX", "code": "rm [flags] target"}, {"h": "CORE USAGE", "b": ["<b>rm file<\/b> — delete a file", "<b>-r<\/b> — recursive — delete a directory and everything inside it", "<b>-i<\/b> — ask for confirmation before each deletion"]}, {"h": "EXAMPLE", "term": ["void@void:~$ rm old.txt", "void@void:~$ rm -r OldFolder"]}, {"h": "MENTAL MODEL", "b": ["No recycle bin — what rm deletes is gone."]}], "probs": [], "qs": []}, {"id": "cat", "name": "cat", "tag": "Basics (pending mastery)", "blocks": [{"h": "PURPOSE", "b": ["Prints the contents of one or more files to the screen."]}, {"h": "SYNTAX", "code": "cat [flags] file [file2 ...]"}, {"h": "CORE USAGE", "b": ["<b>cat file<\/b> — print the whole file", "<b>cat a b<\/b> — print file a, then file b, joined together", "<b>-n<\/b> — number every line"]}, {"h": "EXAMPLE", "term": ["void@void:~$ cat notes.txt", "Buy milk", "Call Sam"]}, {"h": "MENTAL MODEL", "b": ["Dump the whole page onto the screen — no scrolling, no editing."]}], "probs": [], "qs": []}, {"id": "head", "name": "head", "tag": "Basics (pending mastery)", "blocks": [{"h": "PURPOSE", "b": ["Shows the first lines of a file (10 by default)."]}, {"h": "SYNTAX", "code": "head [-n N] file"}, {"h": "CORE USAGE", "b": ["<b>-n N<\/b> — show the first N lines instead of 10"]}, {"h": "EXAMPLE", "term": ["void@void:~$ head -n 3 log.txt"]}, {"h": "MENTAL MODEL", "b": ["Peek at the top of the pile."]}], "probs": [], "qs": []}, {"id": "tail", "name": "tail", "tag": "Basics (pending mastery)", "blocks": [{"h": "PURPOSE", "b": ["Shows the last lines of a file (10 by default)."]}, {"h": "SYNTAX", "code": "tail [-n N] file"}, {"h": "CORE USAGE", "b": ["<b>-n N<\/b> — show the last N lines instead of 10", "<b>-f<\/b> — follow — keep watching the file and print new lines as they arrive"]}, {"h": "EXAMPLE", "term": ["void@void:~$ tail -n 5 log.txt", "void@void:~$ tail -f log.txt"]}, {"h": "MENTAL MODEL", "b": ["Peek at the bottom of the pile — where the newest entries land."]}], "probs": [], "qs": []}, {"id": "wc", "name": "wc", "tag": "Basics (pending mastery)", "blocks": [{"h": "PURPOSE", "b": ["Counts lines, words, and bytes in a file."]}, {"h": "SYNTAX", "code": "wc [flags] file"}, {"h": "CORE USAGE", "b": ["<b>-l<\/b> — count lines", "<b>-w<\/b> — count words", "<b>-c<\/b> — count bytes"]}, {"h": "EXAMPLE", "term": ["void@void:~$ wc -l notes.txt", "42 notes.txt"]}, {"h": "MENTAL MODEL", "b": ["A tally counter for text."]}], "probs":
